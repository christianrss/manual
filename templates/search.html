{% extends 'base.html' %}
{% block head %}<script src="/search.js" defer></script>{%endblock%}
{% block content %}<div class="breadcrumb"><a href="/{{lang}}/">{{tr.homepage}}</a> / {{tr.search}}</div><h1>{{tr.search}}</h1><p class="lead">{{tr.search_hint}}</p><form id="manual-search-form" role="search" data-lang="{{lang}}"><label for="manual-query">{{tr.search}}</label><div class="search-inline"><input id="manual-query" type="search" name="q" autofocus placeholder="{{tr.search_hint}}" autocomplete="off"><button type="submit">{{tr.search}} →</button></div></form><p class="small muted" id="search-status" aria-live="polite"></p><div id="search-results"><p>{{'Enter a term to search the entire reference.' if lang=='en' else 'Digite um termo para pesquisar toda a referência.'}}</p></div>{%endblock%}
