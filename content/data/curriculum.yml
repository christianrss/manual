    planned_topics:
      en: >-
        Priority gaps: human technical review, truly unseen algorithm assessment, automatic PostgreSQL failover with independently enforced fencing, multi-host disaster recovery, actual network partitions and production security. CI exercises RabbitMQ three-node quorum majority loss/restore with bounded confirmation checks; PostgreSQL promotion now refuses while Docker reports the old primary running. Unit tests reject missing, wrong-target and stale-epoch fencing receipts; these are decision-gate tests, not a production fence. Static network-partition models exhaustively inspect 3- and 5-voter graphs.
      pt: >-
        Lacunas prioritárias: revisão técnica humana, algoritmos avaliados com casos inéditos privados, failover PostgreSQL automático com fencing independente, recuperação entre hosts, partições de rede reais e segurança de produção. O CI exercita perda/restauração de maioria RabbitMQ com confirmação limitada; o PostgreSQL recusa promoção quando Docker informa primário antigo ativo. Testes unitários rejeitam comprovantes de fencing ausentes, inválidos e de época antiga: validam decisão, não fencing real. Modelos estáticos enumeram grafos de três e cinco votantes.
