tracks:
  - id: amazon-sde-ii
    title: {en: "Amazon SDE II — Core Interview Path", pt: "Amazon SDE II — Formação Central"}
    description:
      en: "Ordered coding, maintainable design and system design; no hiring guarantee."
      pt: "Estudo sequencial de algoritmos, design manutenível e sistemas; sem garantia de contratação."
    reference_urls:
      - https://amazon.jobs/content/en/how-we-hire/sde-ii-oa-prep
      - https://amazon.jobs/content/en/how-we-hire/sde-ii-interview-prep
      - https://amazon.jobs/content/en/how-we-hire/interview-prep/software-development-topics
    sections:
      - title: {en: "Computational foundations and data structures", pt: "Fundamentos computacionais e estruturas de dados"}
        articles: [logic-proofs-invariants, programming-semantics-contracts, programming-control-flow-functions, discrete-counting-probability, discrete-relations-orders, complexity-analysis, arrays-and-strings, recursion-call-stack, recurrence-analysis, linked-lists, stacks-queues, hash-tables, binary-trees-bst, heaps-priority-queues, graph-traversal]
      - title: {en: "Algorithm design and coding", pt: "Projeto de algoritmos e programação"}
        articles: [sorting-algorithms, binary-search, two-pointers-prefix-sums, sliding-window, monotonic-stacks, tree-algorithms, shortest-paths, greedy-intervals, backtracking-search, dynamic-programming, tries-prefix-search, disjoint-set-union]
      - title: {en: "Object design, SOLID and maintainability", pt: "Projeto orientado a objetos, SOLID e manutenibilidade"}
        articles: [testing-maintainability, clean-code-cohesion-coupling, object-oriented-design, low-level-design, solid-dependency-inversion, architecture-dependency-boundaries, domain-modeling-aggregates-invariants, testing-strategies, refactoring-design-patterns, design-pattern-families, state-command-design-patterns, factory-method-abstract-factory, debugging-profiling]
      - title: {en: "Runtime, databases, networking and security", pt: "Execução, bancos de dados, redes e segurança"}
        articles: [machine-representation-isa-cache, cpu-pipeline-hazards-branch-prediction, processes-virtual-memory, heap-allocation-fragmentation, file-descriptors-buffering-fsync, inode-directories-journaling-recovery, cpu-scheduling-fcfs-round-robin, concurrency-synchronization, mlfq-priority-inheritance, http-client-server-fundamentals, ip-routing-dns-resolution, ipv4-fragmentation-path-mtu, dns-authoritative-negative-cname, network-protocols, tcp-byte-stream-framing-flow-control, tcp-rto-retransmission-congestion, tls13-hkdf-handshake, relational-model-sql-basics, database-consistency, transactional-indexing-isolation, sql-query-planning, database-storage-wal, api-security, oauth-pkce-token-security]
      - title: {en: "System design from requirements to failures", pt: "Projeto de sistemas: dos requisitos às falhas"}
        articles: [capacity-estimation, system-design-process, api-contracts-pagination, storage-selection, service-boundaries, caching, load-balancing, rate-limiting, asynchronous-messaging, api-reliability]
      - title: {en: "Independent exercises and communication", pt: "Exercícios independentes e comunicação"}
        articles: [algorithm-interview-workshop, maintainable-implementation-workshop, independent-coding-assessment, independent-coding-assessment-ii, independent-coding-engineering-assessment-iii, legacy-refactoring-assessment, system-design-interview-workshop, adaptive-system-design-assessment, usage-metering-system-design-assessment, evidence-based-interviews]
      - title: {en: "Optional: advanced distributed design and worked systems", pt: "Opcional: projeto distribuído avançado e estudos de sistemas"}
        articles: [system-design-read-write-models, database-replication-failover, data-partitioning-sharding, system-design-notifications, url-shortener, system-design-order-service, system-design-ticket-reservations, system-design-feed, system-design-architecture-review]
      - title: {en: "Optional deeper compiler and VM foundations", pt: "Aprofundamento opcional em compiladores e VM"}
        articles: [formal-languages-finite-automata, context-free-grammars-parsing, lexing-parsing-expression-compiler, static-types-lexical-scopes, typed-functions-call-frames-closures, mutable-cells-recursive-functions, lexical-addresses-bytecode-verification, versioned-bytecode-serialization, tracing-garbage-collection-reachability, integrated-vm-mark-sweep-gc]
    planned_topics:
      en: >-
        Remaining foundational gaps: deeper discrete mathematics beyond finite counting/probability (number theory and nonuniform or higher-order recurrences), full grammar transformations, mutual recursion, heap lifetime analysis, authenticated bytecode distribution, incremental/production garbage collection and machine backends, Turing computability, cache coherence, detailed pipeline implementation and production filesystem data structures/crash testing, fully ACK-driven TCP retransmission/congestion algorithms, real authoritative DNS resolution and DNSSEC validation, AEAD/nonce safety, PKI/signatures and certificate validation in full TLS implementations, remaining advanced design-pattern coverage and independently proctored timed evaluations with non-public test cases. CI does not certify interview readiness.
      pt: >-
        Lacunas fundamentais restantes: matemática discreta além de contagem/probabilidade finitas (teoria dos números e recorrências desiguais ou de ordem superior), transformações gramaticais, recursão mútua, análise de duração da memória, distribuição autenticada de bytecode, gerenciamento integrado de heap e backends nativos, computabilidade de Turing, coerência de cache, implementação detalhada de pipelines e estruturas de filesystems reais e testes de falha física, retransmissão/congestionamento TCP completos por ACK, resolução DNS autoritativa real e validação DNSSEC, AEAD e nonces, PKI/assinaturas e validação real de certificados, outros padrões especializados e avaliações cronometradas supervisionadas com casos não públicos. CI não certifica preparação para entrevistas.
