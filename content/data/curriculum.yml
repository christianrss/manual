tracks:
  - id: amazon-sde-ii
    title: {en: "Amazon SDE II — Core Interview Path", pt: "Amazon SDE II — Formação Central"}
    description:
      en: "Ordered coding, maintainable design and system design; no hiring guarantee."
      pt: "Estudo sequencial de algoritmos, design manutenível e sistemas; sem garantia de contratação."
    reference_urls:
      - https://amazon.jobs/content/en/how-we-hire/sde-ii-oa-prep
      - https://amazon.jobs/content/en/how-we-hire/sde-ii-interview-prep
      - https://amazon.jobs/content/en/how-we-hire/interview-prep/software-development-topics
    sections:
      - title: {en: "Computational foundations and data structures", pt: "Fundamentos computacionais e estruturas de dados"}
        articles: [logic-proofs-invariants, programming-semantics-contracts, discrete-counting-probability, discrete-relations-orders, complexity-analysis, arrays-and-strings, recursion-call-stack, recurrence-analysis, linked-lists, stacks-queues, hash-tables, binary-trees-bst, heaps-priority-queues, graph-traversal, tries-prefix-search, disjoint-set-union]
      - title: {en: "Algorithm design and coding", pt: "Projeto de algoritmos e programação"}
        articles: [sorting-algorithms, binary-search, two-pointers-prefix-sums, sliding-window, monotonic-stacks, tree-algorithms, shortest-paths, greedy-intervals, backtracking-search, dynamic-programming]
      - title: {en: "Object design, SOLID and maintainability", pt: "Projeto orientado a objetos, SOLID e manutenibilidade"}
        articles: [testing-maintainability, clean-code-cohesion-coupling, object-oriented-design, low-level-design, solid-dependency-inversion, testing-strategies, refactoring-design-patterns, design-pattern-families, debugging-profiling]
      - title: {en: "Runtime, databases, networking and security", pt: "Execução, bancos de dados, redes e segurança"}
        articles: [machine-representation-isa-cache, cpu-pipeline-hazards-branch-prediction, processes-virtual-memory, heap-allocation-fragmentation, file-descriptors-buffering-fsync, inode-directories-journaling-recovery, cpu-scheduling-fcfs-round-robin, concurrency-synchronization, mlfq-priority-inheritance, ip-routing-dns-resolution, ipv4-fragmentation-path-mtu, dns-authoritative-negative-cname, network-protocols, tcp-byte-stream-framing-flow-control, tcp-rto-retransmission-congestion, tls13-hkdf-handshake, database-consistency, transactional-indexing-isolation, sql-query-planning, database-storage-wal, api-security, oauth-pkce-token-security]
      - title: {en: "System design from requirements to failures", pt: "Projeto de sistemas: dos requisitos às falhas"}
        articles: [capacity-estimation, system-design-process, api-contracts-pagination, storage-selection, service-boundaries, caching, load-balancing, rate-limiting, asynchronous-messaging, database-replication-failover, data-partitioning-sharding, api-reliability, system-design-notifications, url-shortener, system-design-order-service, system-design-feed, system-design-architecture-review]
      - title: {en: "Independent exercises and communication", pt: "Exercícios independentes e comunicação"}
        articles: [algorithm-interview-workshop, maintainable-implementation-workshop, independent-coding-assessment, independent-coding-assessment-ii, independent-coding-engineering-assessment-iii, system-design-interview-workshop, adaptive-system-design-assessment, evidence-based-interviews]
    planned_topics:
      en: >-
        Remaining foundational gaps: deeper discrete mathematics beyond finite counting/probability (number theory and nonuniform or higher-order recurrences), language compilation and type systems, cache coherence, detailed pipeline implementation and production filesystem data structures/crash testing, fully ACK-driven TCP retransmission/congestion algorithms, real authoritative DNS resolution and DNSSEC validation, AEAD/nonce safety, PKI/signatures and certificate validation in full TLS implementations, remaining advanced design-pattern coverage and independently proctored timed evaluations with non-public test cases. CI does not certify interview readiness.
      pt: >-
        Lacunas fundamentais restantes: matemática discreta além de contagem/probabilidade finitas (teoria dos números e recorrências desiguais ou de ordem superior), compilação e sistemas de tipos, coerência de cache, implementação detalhada de pipelines e estruturas de filesystems reais e testes de falha física, retransmissão/congestionamento TCP completos por ACK, resolução DNS autoritativa real e validação DNSSEC, AEAD e nonces, PKI/assinaturas e validação real de certificados, outros padrões especializados e avaliações cronometradas supervisionadas com casos não públicos. CI não certifica preparação para entrevistas.
  - id: computer-science-core
    title: {en: "Computer Science — Core Curriculum", pt: "Ciência da Computação — Currículo Fundamental"}
    description:
      en: "A general prerequisite-led education with explicitly documented gaps."
      pt: "Formação geral orientada por pré-requisitos e lacunas explicitadas."
    reference_urls:
      - https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
      - https://pages.cs.wisc.edu/~remzi/OSTEP/
    sections:
      - title: {en: "Mathematics, algorithms and implementation", pt: "Matemática, algoritmos e implementação"}
        articles: [logic-proofs-invariants, programming-semantics-contracts, discrete-counting-probability, discrete-relations-orders, complexity-analysis, recursion-call-stack, recurrence-analysis, arrays-and-strings, linked-lists, stacks-queues, sorting-algorithms, binary-search, hash-tables, heaps-priority-queues, binary-trees-bst, graph-traversal, dynamic-programming]
      - title: {en: "Software design and engineering", pt: "Projeto e engenharia de software"}
        articles: [testing-maintainability, clean-code-cohesion-coupling, object-oriented-design, low-level-design, solid-dependency-inversion, testing-strategies, refactoring-design-patterns, design-pattern-families, debugging-profiling, software-project-lifecycle, ci-cd-release-engineering]
      - title: {en: "Processes, threads, memory and networks", pt: "Processos, threads, memória e redes"}
        articles: [machine-representation-isa-cache, cpu-pipeline-hazards-branch-prediction, processes-virtual-memory, heap-allocation-fragmentation, file-descriptors-buffering-fsync, inode-directories-journaling-recovery, cpu-scheduling-fcfs-round-robin, concurrency-synchronization, mlfq-priority-inheritance, memory-ordering-atomics, cpp17-concurrency-implementation, ip-routing-dns-resolution, ipv4-fragmentation-path-mtu, dns-authoritative-negative-cname, network-protocols, tcp-byte-stream-framing-flow-control, tcp-rto-retransmission-congestion]
      - title: {en: "Security, storage and distributed systems", pt: "Segurança, armazenamento e sistemas distribuídos"}
        articles: [tls13-hkdf-handshake, api-security, oauth-pkce-token-security, database-storage-wal, sql-query-planning, database-consistency, transactional-indexing-isolation, asynchronous-messaging, raft-consensus, network-partition-quorum-models]
      - title: {en: "Architecture and operational judgment", pt: "Arquitetura e julgamento operacional"}
        articles: [capacity-estimation, system-design-process, storage-selection, service-boundaries, production-incident-response, formal-model-checking]
    planned_topics:
      en: >-
        Not published: advanced number theory and higher-order recurrences, computability, P/NP, digital logic, microarchitectural implementation, cache coherence, production allocator internals, advanced multicore scheduling, production filesystem recovery and fault injection, full TCP sequence wrap/retransmission and ACK-driven congestion models, DNSSEC, IPv6 neighbor discovery and live packet captures, AEAD/signatures/PKI beyond HKDF, P2P and optional blockchain.
      pt: >-
        Não publicados: teoria dos números avançada e recorrências de ordem superior, computabilidade, P/NP, lógica digital, implementação microarquitetural, coerência de cache, alocadores de produção, escalonamento multicore avançado, recuperação real de filesystems e injeção de falhas, modelos completos de sequência circular/retransmissão e congestionamento TCP por ACK, DNSSEC, descoberta de vizinhos IPv6 e capturas reais de pacotes, AEAD/assinaturas/PKI além de HKDF, P2P e blockchain opcional.
  - id: specialized-systems-labs
    title: {en: "Advanced Systems — Optional Laboratories", pt: "Sistemas Avançados — Laboratórios Opcionais"}
    description:
      en: "Infrastructure and adversarial experiments after the core curriculum."
      pt: "Experimentos de infraestrutura e falhas após o currículo fundamental."
    reference_urls:
      - https://www.postgresql.org/docs/current/
      - https://www.rabbitmq.com/docs
    sections:
      - title: {en: "Database concurrency and recovery", pt: "Concorrência e recuperação de bancos"}
        articles: [postgresql-concurrency-integration, postgresql-serializable-retry-lab, sqlite-multiprocess-recovery, postgresql-streaming-promotion, postgresql-failover-fencing-gates, postgresql-failover-rpo-rto-measurements]
      - title: {en: "Broker durability, quorum and partitions", pt: "Durabilidade, quórum e partições em brokers"}
        articles: [rabbitmq-durable-consumer-integration, rabbitmq-broker-restart-lab, rabbitmq-quorum-leader-failover, rabbitmq-quorum-majority-loss, rabbitmq-live-network-partition-lab]
      - title: {en: "Advanced exercises", pt: "Exercícios avançados"}
        articles: [concurrency-interview-workshop, failure-recovery-workshop, property-based-algorithm-testing, strongly-connected-components, maximum-flow-matching, distributed-observability]
    planned_topics:
      en: >-
        Experiments only establish their stated lab conditions, not cross-host production fault tolerance or universally correct systems.
      pt: >-
        Experimentos comprovam apenas suas condições de laboratório, não tolerância a falhas multi-host em produção nem correção universal.
