    planned_topics:
      en: >-
        Priority gaps: human technical review, genuinely unseen algorithm assessment, independently enforced production PostgreSQL fencing and automatic failover, multi-host disaster recovery, asymmetric network packet faults, client-visible RTO/RPO and security. Docker CI now disconnects an otherwise-running RabbitMQ quorum member and verifies loss/restoration of publication confirms. PostgreSQL CI isolates a still-writable primary, refuses promotion until stopped, and reports controlled phase timings, not end-to-end RTO or zero-data-loss RPO.
      pt: >-
        Lacunas prioritárias: revisão técnica humana, algoritmos inéditos privados, fencing PostgreSQL independente e failover automático em produção, recuperação entre hosts, perda assimétrica de pacotes, RTO/RPO percebidos pelo cliente e segurança. CI Docker agora desconecta nó quorum RabbitMQ que continua em execução e verifica perda/retorno de confirms. PostgreSQL isola primário ainda gravável, recusa promoção até sua parada e registra tempos de etapas controladas, não RTO end-to-end ou RPO zero.
