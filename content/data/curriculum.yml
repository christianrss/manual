    planned_topics:
      en: >-
        Priority gaps: unfamiliar private test cases, human technical review, PostgreSQL/broker integration and faults beyond process termination, and stronger cross-language portability checks. A C++17 implementation is compiled in CI; separate SQLite processes exercise real file transactions and crash/retry; two unsolved graph drills have a public grader. These original exercises are not employer questions.
      pt: >-
        Lacunas prioritárias: casos privados inéditos, revisão humana especializada, integração real com PostgreSQL/broker e falhas além do encerramento de processo, mais portabilidade entre linguagens. Exemplo C++17 compila no CI; processos SQLite disputam transações em arquivo e testam crash/replay; dois desafios inéditos têm verificador público. Não são questões oficiais do empregador.
