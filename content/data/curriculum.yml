version: 1
updated: 2026-10-09
tracks:
  - id: amazon-sde-ii
    title: {en: Amazon Software Development Engineer II, pt: Amazon Software Development Engineer II}
    description:
      en: A targeted study itinerary mapped to publicly documented competencies; it does not imply endorsement or guaranteed outcomes.
      pt: Itinerário de estudos baseado em competências documentadas publicamente; não implica endosso nem aprovação garantida.
    reference_urls:
      - https://amazon.jobs/content/en/how-we-hire/sde-ii-interview-prep
      - https://amazon.jobs/content/en/how-we-hire/sde-ii-oa-prep
      - https://amazon.jobs/content/en/how-we-hire/interview-prep/software-development-topics
    sections:
      - title: {en: Mathematical foundations & data structures, pt: Fundamentos matemáticos e estruturas de dados}
        articles: [complexity-analysis, arrays-and-strings, stacks-queues, recursion-call-stack, linked-lists, hash-tables, binary-trees-bst, heaps-priority-queues, tries-prefix-search, graph-traversal, disjoint-set-union]
      - title: {en: Algorithmic problem solving, pt: Resolução de problemas algorítmicos}
        articles: [sorting-algorithms, two-pointers-prefix-sums, binary-search, sliding-window, greedy-intervals, monotonic-stacks, tree-algorithms, dynamic-programming, backtracking-search, shortest-paths, strongly-connected-components, maximum-flow-matching]
      - title: {en: Software engineering & object-oriented design, pt: Engenharia de software e design orientado a objetos}
        articles: [object-oriented-design, solid-dependency-inversion, testing-maintainability, testing-strategies, debugging-profiling, refactoring-design-patterns, ci-cd-release-engineering, low-level-design]
      - title: {en: Runtime, operating systems & correctness, pt: Runtime, sistemas operacionais e correção}
        articles: [processes-virtual-memory, concurrency-synchronization, memory-ordering-atomics]
      - title: {en: System design & distributed architecture, pt: Projeto de sistemas e arquitetura distribuída}
        articles: [capacity-estimation, system-design-process, storage-selection, service-boundaries, caching, database-consistency, database-storage-wal, sql-query-planning, transactional-indexing-isolation, database-replication-failover, data-partitioning-sharding, asynchronous-messaging, load-balancing, rate-limiting, network-protocols, api-security, oauth-pkce-token-security, api-reliability, api-contracts-pagination, system-design-notifications, system-design-order-service, system-design-feed, raft-consensus, distributed-observability, url-shortener]
      - title: {en: Engineering judgment & communication, pt: Julgamento técnico e comunicação}
        articles: [formal-model-checking, production-incident-response, evidence-based-interviews]
    planned_topics:
      en: >-
        Priority gaps for the SDE II track: end-to-end software project lifecycle, design interview drills, testing system designs under realistic failures and further algorithm practice. Service boundaries, debugging/profiling, CI/CD release engineering and refactoring/design patterns now have standalone EN/PT chapters. Published material still needs review and practice.
      pt: >-
        Lacunas prioritárias da trilha SDE II: ciclo de vida completo de projetos, exercícios de entrevistas de arquitetura, testes de projetos sob falhas realistas e mais prática algorítmica. Fronteiras de serviços, debugging/profiling, CI/CD e refatoração/padrões já têm artigos próprios EN/PT. A revisão técnica continua.
