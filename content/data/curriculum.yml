      pt: >-
        Não publicados: teoria dos números avançada e recorrências de ordem superior, florestas de análise, recursão mútua, coleta incremental e análise de layout de objetos, distribuição autenticada de bytecode e código nativo, computabilidade de Turing, P/NP, lógica digital, implementação microarquitetural, coerência de cache, alocadores de produção, escalonamento multicore avançado, recuperação real de filesystems e injeção de falhas, modelos completos de sequência circular/retransmissão e congestionamento TCP por ACK, DNSSEC, descoberta de vizinhos IPv6 e capturas reais de pacotes, AEAD/assinaturas/PKI além de HKDF, P2P e blockchain opcional.
