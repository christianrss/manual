    planned_topics:
      en: >-
        Priority gaps: unfamiliar private coding tests, expert review, PostgreSQL failover and RabbitMQ broker-restart/quorum tests, cross-language portability and production security review. The current CI provisions PostgreSQL 17 and RabbitMQ 4, tests concurrent database commands and a lost-ACK redelivery with a transactional inbox. Adaptive System Design drills now exercise changing constraints; these are independent exercises, not official employer questions.
      pt: >-
        Lacunas prioritárias: casos inéditos privados, revisão técnica especializada, testes de failover PostgreSQL e reinício/quorum RabbitMQ, portabilidade entre linguagens e revisão de segurança. O CI atual inicia PostgreSQL 17 e RabbitMQ 4, testa comandos concorrentes e redelivery após perda de ACK com inbox transacional. Oficinas de System Design adaptativo exercitam mudanças de requisitos; são material independente.
