    planned_topics:
      en: >-
        Priority gaps: genuinely new independent coding assessments, expert technical review, replicated PostgreSQL failover, multi-node RabbitMQ quorum and production security testing. CI now includes Hypothesis-generated independent algorithm oracles, PostgreSQL SERIALIZABLE write-skew/whole-transaction retry, and an actual RabbitMQ single-container restart test. Checkout architecture review adds concrete blocking findings. These chapters are not employer questions.
      pt: >-
        Lacunas prioritárias: avaliações independentes inéditas, revisão técnica especializada, failover de PostgreSQL replicado, quorum RabbitMQ com vários nós e testes de segurança. O CI agora inclui oráculos de algoritmos gerados por Hypothesis, write skew/retentativa SERIALIZABLE no PostgreSQL e restart real do mesmo container RabbitMQ. A auditoria do checkout traz achados bloqueantes. Não são questões do empregador.
