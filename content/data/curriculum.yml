        articles: [testing-maintainability, processes-virtual-memory, concurrency-synchronization]
      - title: {en: System design & distributed architecture, pt: Projeto de sistemas e arquitetura distribuída}
        articles: [capacity-estimation, caching, database-consistency, asynchronous-messaging, load-balancing, rate-limiting, url-shortener]
      - title: {en: Engineering judgment & communication, pt: Julgamento técnico e comunicação}
        articles: [evidence-based-interviews]
    planned_topics:
      en: Security engineering, distributed consensus, networking protocols, advanced graph algorithms, API reliability and low-level design remain planned for later editions.
      pt: Engenharia de segurança, consenso distribuído, protocolos de redes, grafos avançados, confiabilidade de APIs e low-level design permanecem planejados.
