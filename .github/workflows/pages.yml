name: Validate and deploy manual
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DSN: postgresql://manual:manual@127.0.0.1:5432/manual
      RABBITMQ_HOST: 127.0.0.1
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: manual
          POSTGRES_PASSWORD: manual
          POSTGRES_DB: manual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manual -d manual"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python scripts/build.py
      - run: python -m unittest discover -s tests -v
      - name: Verify RabbitMQ restart persistence
        env:
          RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: python scripts/verify_rabbitmq_restart.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
