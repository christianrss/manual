<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 258" role="img" aria-labelledby="t d"><title id="t">Replication position stages</title><desc id="d">A primary generates WAL; a standby receives, flushes and applies WAL sequentially. Acknowledging the primary before standby flush creates a possible loss window.</desc><rect width="850" height="258" fill="white"/><text x="22" y="30" font-family="monospace" font-size="17">Primary → standby WAL progress</text><rect x="20" y="75" width="165" height="72" stroke="#4169a3" fill="#f7f9fc"/><text x="102" y="108" text-anchor="middle" font-family="monospace" font-size="15">Primary</text><text x="102" y="128" text-anchor="middle" font-family="monospace" font-size="12">120000</text><rect x="235" y="75" width="165" height="72" stroke="#4169a3" fill="#f7f9fc"/><text x="317" y="108" text-anchor="middle" font-family="monospace" font-size="15">Receive</text><text x="317" y="128" text-anchor="middle" font-family="monospace" font-size="12">119200</text><rect x="450" y="75" width="165" height="72" stroke="#4169a3" fill="#f7f9fc"/><text x="532" y="108" text-anchor="middle" font-family="monospace" font-size="15">Flush</text><text x="532" y="128" text-anchor="middle" font-family="monospace" font-size="12">119000</text><rect x="665" y="75" width="165" height="72" stroke="#4169a3" fill="#e7f0fd"/><text x="747" y="108" text-anchor="middle" font-family="monospace" font-size="15">Replay</text><text x="747" y="128" text-anchor="middle" font-family="monospace" font-size="12">118500</text><g stroke="#4169a3" stroke-width="3" fill="none"><path d="M188 110 H227 l-10 -8 m10 8 l-10 8 M403 110 H442 l-10 -8 m10 8 l-10 8 M618 110 H657 l-10 -8 m10 8 l-10 8"/></g><text x="22" y="192" font-family="monospace" font-size="14" fill="#444">Received ≠ durable ≠ visible to readers.</text><text x="22" y="220" font-family="monospace" font-size="14" fill="#444">Lag metrics require a precisely defined position boundary.</text></svg>