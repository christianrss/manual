<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 245" role="img" aria-labelledby="t d"><title id="t">Two distinct coding challenges</title><desc id="d">A list of workloads is partitioned into contiguous batches to minimize the maximum sum. Separately, active grid cells join neighboring connected components with duplicates ignored. Solutions are intentionally omitted.</desc><rect width="920" height="245" fill="white"/><text x="18" y="28" font-family="monospace" font-size="18">Derive the invariant; solutions intentionally withheld</text><rect x="20" y="67" width="425" height="141" rx="4" fill="#f0f6ff" stroke="#4b6d9e"/><text x="38" y="94" font-family="monospace" font-size="15">A. Preserve sequence order</text><rect x="42" y="117" width="63" height="47" fill="#bedaff" stroke="#4b6d9e"/><text x="73" y="147" text-anchor="middle" font-family="monospace" font-size="17">7</text><rect x="114" y="117" width="63" height="47" fill="#bedaff" stroke="#4b6d9e"/><text x="145" y="147" text-anchor="middle" font-family="monospace" font-size="17">2</text><rect x="186" y="117" width="63" height="47" fill="#bedaff" stroke="#4b6d9e"/><text x="217" y="147" text-anchor="middle" font-family="monospace" font-size="17">5</text><rect x="258" y="117" width="63" height="47" fill="#dde8f9" stroke="#4b6d9e"/><text x="289" y="147" text-anchor="middle" font-family="monospace" font-size="17">10</text><rect x="330" y="117" width="63" height="47" fill="#dde8f9" stroke="#4b6d9e"/><text x="361" y="147" text-anchor="middle" font-family="monospace" font-size="17">8</text><text x="38" y="192" font-family="monospace" font-size="13">Minimize maximum contiguous batch sum</text><rect x="470" y="67" width="432" height="141" rx="4" fill="#f0f6ff" stroke="#4b6d9e"/><text x="488" y="94" font-family="monospace" font-size="15">B. Activate cells, track islands</text><rect x="522" y="109" width="52" height="32" fill="#bedaff" stroke="#4b6d9e"/><rect x="583" y="109" width="52" height="32" fill="#bedaff" stroke="#4b6d9e"/><rect x="644" y="147" width="52" height="32" fill="#bedaff" stroke="#4b6d9e"/><rect x="583" y="147" width="52" height="32" fill="#bedaff" stroke="#4b6d9e"/><text x="488" y="192" font-family="monospace" font-size="13">Orthogonal connections only; duplicates no-op</text></svg>