<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 270" role="img" aria-labelledby="t d"><title id="t">Release acquire synchronizes with publication</title><desc id="d">Producer initializes two fields and releases a ready flag. Consumer acquires the same ready flag, then reads the initialized fields safely if the release value was observed.</desc><rect width="850" height="270" fill="#fff"/><text x="20" y="27" font-family="monospace" font-size="17">One-shot release/acquire publication</text><g stroke="#506ba0" stroke-width="2.2" fill="none"><path d="M150 62 V225 M650 62 V225 M150 156 H650"/></g><g font-family="monospace" fill="#222" font-size="15"><text x="80" y="52">Producer</text><text x="580" y="52">Consumer</text><text x="167" y="90">write payload</text><text x="167" y="135">ready.store(release)</text><text x="475" y="150">ready.load(acquire)</text><text x="475" y="190">read payload</text></g><text x="20" y="252" font-family="monospace" font-size="13" fill="#555">Matching acquire observes release → happens-before.</text></svg>