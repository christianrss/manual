<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" width="760" height="285" role="img" aria-labelledby="title description">
<title id="title">Trie for car, cart, and cat</title><desc id="description">Root points to c then a. Prefix ca branches to r and t. The r node is the word car, whose t child ends cart; the other branch is cat.</desc>
<rect width="760" height="285" fill="white"/>
<g stroke="#666" stroke-width="2.5" fill="none"><path d="M380 35 L380 84 M380 109 L380 154 M380 176 L255 220 M380 176 L505 220 M255 243 L255 265"/></g>
<circle cx="380" cy="29" r="20" fill="#f7f7f7" stroke="#3763a1" stroke-width="1.5"/><text x="380" y="34" text-anchor="middle" font-family="monospace" font-size="15">root</text><circle cx="380" cy="95" r="20" fill="#f7f7f7" stroke="#3763a1" stroke-width="1.5"/><text x="380" y="100" text-anchor="middle" font-family="monospace" font-size="15">c</text><circle cx="380" cy="164" r="20" fill="#f7f7f7" stroke="#3763a1" stroke-width="1.5"/><text x="380" y="169" text-anchor="middle" font-family="monospace" font-size="15">a</text><circle cx="255" cy="226" r="20" fill="#dceafd" stroke="#3763a1" stroke-width="1.5"/><text x="255" y="231" text-anchor="middle" font-family="monospace" font-size="15">r</text><circle cx="280" cy="214" r="4" fill="#0b5c3b"/><circle cx="505" cy="226" r="20" fill="#dceafd" stroke="#3763a1" stroke-width="1.5"/><text x="505" y="231" text-anchor="middle" font-family="monospace" font-size="15">t</text><circle cx="530" cy="214" r="4" fill="#0b5c3b"/><circle cx="255" cy="266" r="20" fill="#dceafd" stroke="#3763a1" stroke-width="1.5"/><text x="255" y="271" text-anchor="middle" font-family="monospace" font-size="15">t</text><circle cx="280" cy="254" r="4" fill="#0b5c3b"/>
<text x="20" y="26" font-family="monospace" fill="#444" font-size="13">Green dot = complete stored key</text></svg>