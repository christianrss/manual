<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270"><title>Trie sharing prefixes of car cart cat</title><desc>root leads to c then a, branching into r and t. Node r is terminal and has child t, also terminal.</desc><rect width="760" height="270" fill="white"/><g stroke="#555" fill="none" stroke-width="2"><path d="M380 43 V84 M380 111 V147 M380 177 L270 220 M380 177 L495 220"/></g><rect x="338" y="15" width="84" height="34" fill="#eef3fc" stroke="#3763a1"/><text x="380" y="37" text-anchor="middle" font-size="15" font-family="monospace">root</text><rect x="338" y="82" width="84" height="34" fill="#eef3fc" stroke="#3763a1"/><text x="380" y="104" text-anchor="middle" font-size="15" font-family="monospace">c</text><rect x="338" y="144" width="84" height="34" fill="#eef3fc" stroke="#3763a1"/><text x="380" y="166" text-anchor="middle" font-size="15" font-family="monospace">a</text><rect x="228" y="219" width="84" height="34" fill="#eef3fc" stroke="#3763a1"/><text x="270" y="241" text-anchor="middle" font-size="15" font-family="monospace">r*</text><rect x="453" y="219" width="84" height="34" fill="#eef3fc" stroke="#3763a1"/><text x="495" y="241" text-anchor="middle" font-size="15" font-family="monospace">t*</text><text x="25" y="250" font-family="monospace" font-size="13">* = terminal key; additional suffix branches omitted for clarity</text></svg>