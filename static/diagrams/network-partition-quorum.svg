<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 255" role="img" aria-labelledby="t d"><title id="t">Network partitions and quorum majority</title><desc id="d">A three-node cluster split into two connected members and one isolated member has one majority component. A split into three isolated members has none. Restoring links recreates a majority. This is a static graph model, not a live network fault injection.</desc><rect width="950" height="255" fill="white"/><text x="20" y="28" font-family="monospace" font-size="18">Static symmetric partitions: 2-of-3 quorum</text><rect x="14" y="70" width="300" height="122" rx="5" fill="#e8f1ff" stroke="#4c6f9b" stroke-width="2"/><text x="164" y="101" text-anchor="middle" font-family="monospace" font-size="15">2 + 1: majority</text><circle cx="87" cy="143" r="16" fill="#b6d9fa" stroke="#4c6f9b"/><text x="87" y="148" text-anchor="middle" font-size="14" font-family="monospace">1</text><circle cx="157" cy="143" r="16" fill="#b6d9fa" stroke="#4c6f9b"/><text x="157" y="148" text-anchor="middle" font-size="14" font-family="monospace">2</text><circle cx="227" cy="143" r="16" fill="#b6d9fa" stroke="#4c6f9b"/><text x="227" y="148" text-anchor="middle" font-size="14" font-family="monospace">3</text><path d="M103 143 H141" stroke="#4c6f9b" stroke-width="3"/></rect><rect x="330" y="70" width="300" height="122" rx="5" fill="#f9e9e3" stroke="#4c6f9b" stroke-width="2"/><text x="480" y="101" text-anchor="middle" font-family="monospace" font-size="15">1 + 1 + 1: none</text><circle cx="403" cy="143" r="16" fill="#ead0c6" stroke="#4c6f9b"/><text x="403" y="148" text-anchor="middle" font-size="14" font-family="monospace">1</text><circle cx="473" cy="143" r="16" fill="#ead0c6" stroke="#4c6f9b"/><text x="473" y="148" text-anchor="middle" font-size="14" font-family="monospace">2</text><circle cx="543" cy="143" r="16" fill="#ead0c6" stroke="#4c6f9b"/><text x="543" y="148" text-anchor="middle" font-size="14" font-family="monospace">3</text></rect><rect x="646" y="70" width="300" height="122" rx="5" fill="#e8f1ff" stroke="#4c6f9b" stroke-width="2"/><text x="796" y="101" text-anchor="middle" font-family="monospace" font-size="15">3 connected: majority</text><circle cx="719" cy="143" r="16" fill="#b6d9fa" stroke="#4c6f9b"/><text x="719" y="148" text-anchor="middle" font-size="14" font-family="monospace">1</text><circle cx="789" cy="143" r="16" fill="#b6d9fa" stroke="#4c6f9b"/><text x="789" y="148" text-anchor="middle" font-size="14" font-family="monospace">2</text><circle cx="859" cy="143" r="16" fill="#b6d9fa" stroke="#4c6f9b"/><text x="859" y="148" text-anchor="middle" font-size="14" font-family="monospace">3</text><path d="M735 143 H773" stroke="#4c6f9b" stroke-width="3"/><path d="M805 143 H843" stroke="#4c6f9b" stroke-width="3"/></rect><text x="20" y="226" font-family="monospace" font-size="14">Exhaustive link graphs (3 voters: 8; 5 voters: 1,024)</text></svg>