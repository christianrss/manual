<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" role="img" aria-labelledby="t d"><title id="t">Reservation state machine</title><desc id="d">Reservation starts pending. Pending can transition to confirmed or cancelled. Confirmed can transition to cancelled. Cancelled is terminal.</desc><rect width="850" height="260" fill="white"/><text x="28" y="30" font-family="monospace" font-size="17">Explicit reservation transitions</text><g stroke="#466ba0" stroke-width="2.5" fill="none"><path d="M262 100 H382 M520 100 H655 M239 131 L655 197"/></g><rect x="70" y="69" width="190" height="62" fill="#edf3ff" stroke="#466ba0" stroke-width="1.5"/><text x="165" y="105" text-anchor="middle" font-family="monospace" font-size="15">PENDING</text><rect x="360" y="69" width="190" height="62" fill="#edf3ff" stroke="#466ba0" stroke-width="1.5"/><text x="455" y="105" text-anchor="middle" font-family="monospace" font-size="15">CONFIRMED</text><rect x="620" y="169" width="190" height="62" fill="#edf3ff" stroke="#466ba0" stroke-width="1.5"/><text x="715" y="205" text-anchor="middle" font-family="monospace" font-size="15">CANCELLED</text><g fill="#333" font-family="monospace" font-size="12"><text x="320" y="87">confirm</text><text x="576" y="87">cancel</text><text x="425" y="188">cancel</text><text x="30" y="240">No transition out of CANCELLED.</text></g></svg>