<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 245" role="img" aria-labelledby="title desc"><title id="title">Property based testing, shrinking and regression cycle</title><desc id="desc">Valid input generators feed the algorithm and an independent oracle, whose answers are compared. A failing case is shrunk into a regression fixture.</desc><rect width="920" height="245" fill="white"/><text x="22" y="30" font-family="monospace" font-size="17">Generate valid cases, check independent evidence</text><rect x="18" y="77" width="164" height="62" rx="3" fill="#f2f7fc" stroke="#486da2" stroke-width="2"/><text x="100" y="113" font-family="monospace" font-size="15" text-anchor="middle">Generator</text><path d="M183 107 h15" stroke="#486da2" stroke-width="2"/><rect x="198" y="77" width="164" height="62" rx="3" fill="#f2f7fc" stroke="#486da2" stroke-width="2"/><text x="280" y="113" font-family="monospace" font-size="15" text-anchor="middle">Algorithm</text><path d="M363 107 h15" stroke="#486da2" stroke-width="2"/><rect x="378" y="77" width="164" height="62" rx="3" fill="#f2f7fc" stroke="#486da2" stroke-width="2"/><text x="460" y="113" font-family="monospace" font-size="15" text-anchor="middle">Oracle</text><path d="M543 107 h15" stroke="#486da2" stroke-width="2"/><rect x="558" y="77" width="164" height="62" rx="3" fill="#dfecff" stroke="#486da2" stroke-width="2"/><text x="640" y="113" font-family="monospace" font-size="15" text-anchor="middle">Compare</text><path d="M723 107 h15" stroke="#486da2" stroke-width="2"/><rect x="738" y="77" width="164" height="62" rx="3" fill="#f2f7fc" stroke="#486da2" stroke-width="2"/><text x="820" y="113" font-family="monospace" font-size="15" text-anchor="middle">Shrink</text><text x="22" y="190" font-family="monospace" font-size="14">On failure: store smallest witness as a stable regression test.</text><text x="22" y="222" font-family="monospace" font-size="14">A green run is sampling evidence, not a universal correctness proof.</text></svg>