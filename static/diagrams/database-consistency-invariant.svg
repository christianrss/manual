<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t d"><title id="t">Write-skew transaction timeline</title><desc id="d">Transactions T1 and T2 read A on and B on. T1 sets A off, T2 sets B off. Both committing without a cross-row invariant check leaves no doctor on call.</desc><rect width="760" height="250" fill="#fff"/><text x="20" y="30" font-family="monospace" font-size="16" fill="#333">Invariant: A OR B = true</text><g font-family="monospace" font-size="15" fill="#111"><text x="20" y="78">T1</text><text x="20" y="140">T2</text><text x="150" y="78">READ A=1,B=1</text><text x="150" y="140">READ A=1,B=1</text><text x="380" y="78">A := 0</text><text x="380" y="140">B := 0</text><text x="530" y="78">COMMIT</text><text x="530" y="140">COMMIT</text></g><g stroke="#888" stroke-width="2"><path d="M58 84 H730 M58 147 H730"/></g><rect x="145" y="178" width="560" height="47" fill="#faeeee" stroke="#a33"/><text x="425" y="208" text-anchor="middle" font-family="monospace" fill="#922" font-size="17">final A=0, B=0: invariant violated</text></svg>