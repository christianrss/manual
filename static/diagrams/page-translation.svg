<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260"><title>Virtual address to physical address translation</title><desc>Virtual address decomposes into VPN and offset. The page table finds a physical frame number. The offset stays the same.</desc><rect width="760" height="260" fill="white"/><g font-family="monospace" font-size="16" fill="#333"><text x="30" y="37">virtual address = VPN * P + offset</text><text x="30" y="85">virtual page</text><text x="190" y="85">offset</text><text x="495" y="85">physical frame</text><text x="630" y="85">offset</text></g><g stroke="#3763a1" fill="#eaf2ff" stroke-width="2"><rect x="30" y="100" width="160" height="60"/><rect x="190" y="100" width="105" height="60"/><rect x="485" y="100" width="145" height="60"/><rect x="630" y="100" width="100" height="60"/></g><text x="108" y="135" font-family="monospace" text-anchor="middle">VPN</text><text x="241" y="135" font-family="monospace" text-anchor="middle">d</text><text x="558" y="135" font-family="monospace" text-anchor="middle">PFN</text><text x="679" y="135" font-family="monospace" text-anchor="middle">d</text><path d="M110 166 V209 H557 V166" stroke="#3763a1" stroke-width="2" fill="none"/><text x="350" y="204" font-family="monospace" font-size="13" fill="#333">page table: VPN → PFN</text><text x="30" y="242" font-family="monospace" font-size="14">physical address = PFN * P + offset</text></svg>