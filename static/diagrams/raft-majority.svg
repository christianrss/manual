<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 245" role="img" aria-labelledby="t d"><title id="t">Five-voter Raft majority</title><desc id="d">Five voting servers; any quorum of three intersects every other quorum of three.</desc><rect width="820" height="245" fill="white"/><text x="22" y="31" font-family="monospace" font-size="17">Five voting nodes; quorum = 3</text><circle cx="90" cy="120" r="42" fill="#d7e8ff" stroke="#476b9a" stroke-width="2"/><text x="90" y="126" text-anchor="middle" font-family="monospace" font-size="20">1</text><circle cx="243" cy="120" r="42" fill="#d7e8ff" stroke="#476b9a" stroke-width="2"/><text x="243" y="126" text-anchor="middle" font-family="monospace" font-size="20">2</text><circle cx="396" cy="120" r="42" fill="#d7e8ff" stroke="#476b9a" stroke-width="2"/><text x="396" y="126" text-anchor="middle" font-family="monospace" font-size="20">3</text><circle cx="549" cy="120" r="42" fill="#f5f5f5" stroke="#476b9a" stroke-width="2"/><text x="549" y="126" text-anchor="middle" font-family="monospace" font-size="20">4</text><circle cx="702" cy="120" r="42" fill="#f5f5f5" stroke="#476b9a" stroke-width="2"/><text x="702" y="126" text-anchor="middle" font-family="monospace" font-size="20">5</text><text x="22" y="205" font-family="monospace" font-size="15" fill="#444">Any two majorities intersect; elections and log rules ensure safety.</text></svg>