<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 256" role="img" aria-labelledby="t d"><title id="t">Recursion call stack</title><desc id="d">Factorial three invokes factorial two, one, zero in sequence; returns unwind in reverse order with result six.</desc><rect width="850" height="256" fill="white"/><text x="24" y="29" font-family="monospace" font-size="17">Call order ↓; return values unwind ↑</text><rect x="30" y="82" width="179" height="73" stroke="#42689c" fill="#f4f7fd" stroke-width="2"/><text x="119" y="111" font-family="monospace" text-anchor="middle" font-size="16">factorial(3)</text><text x="119" y="137" font-family="monospace" text-anchor="middle" font-size="13">returns 6</text><text x="221" y="121" font-family="monospace" font-size="17">→</text><rect x="235" y="82" width="179" height="73" stroke="#42689c" fill="#f4f7fd" stroke-width="2"/><text x="324" y="111" font-family="monospace" text-anchor="middle" font-size="16">factorial(2)</text><text x="324" y="137" font-family="monospace" text-anchor="middle" font-size="13">returns 2</text><text x="426" y="121" font-family="monospace" font-size="17">→</text><rect x="440" y="82" width="179" height="73" stroke="#42689c" fill="#f4f7fd" stroke-width="2"/><text x="529" y="111" font-family="monospace" text-anchor="middle" font-size="16">factorial(1)</text><text x="529" y="137" font-family="monospace" text-anchor="middle" font-size="13">returns 1</text><text x="631" y="121" font-family="monospace" font-size="17">→</text><rect x="645" y="82" width="179" height="73" stroke="#42689c" fill="#ddeeff" stroke-width="2"/><text x="734" y="111" font-family="monospace" text-anchor="middle" font-size="16">factorial(0)</text><text x="734" y="137" font-family="monospace" text-anchor="middle" font-size="13">returns 1</text><text x="25" y="201" font-family="monospace" font-size="14">n=0 is base case; active frames grow with n.</text><text x="25" y="229" font-family="monospace" font-size="14">Termination: each recursive argument is strictly smaller.</text></svg>