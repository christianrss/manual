<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 925 259" role="img" aria-labelledby="t d"><title id="t">Evolving document processing system design</title><desc id="d">Authenticated upload stores blobs and authoritative metadata; a tenant-aware queue feeds workers and a search read model. A region policy constrains where these components may run, and tombstones prevent deleted files reappearing after retries.</desc><rect width="925" height="259" fill="white"/><text x="18" y="28" font-family="monospace" font-size="17">Change requirements, preserve invariants</text><rect x="14" y="78" width="168" height="61" fill="#f1f6fb" stroke="#466ea3" stroke-width="2" rx="3"/><text x="98" y="113" font-family="monospace" font-size="14" text-anchor="middle">Upload</text><path d="M184 109 h13" stroke="#466ea3" stroke-width="2"/><rect x="197" y="78" width="168" height="61" fill="#deeeff" stroke="#466ea3" stroke-width="2" rx="3"/><text x="281" y="113" font-family="monospace" font-size="14" text-anchor="middle">Blob+DB</text><path d="M367 109 h13" stroke="#466ea3" stroke-width="2"/><rect x="380" y="78" width="168" height="61" fill="#f1f6fb" stroke="#466ea3" stroke-width="2" rx="3"/><text x="464" y="113" font-family="monospace" font-size="14" text-anchor="middle">Tenant queues</text><path d="M550 109 h13" stroke="#466ea3" stroke-width="2"/><rect x="563" y="78" width="168" height="61" fill="#f1f6fb" stroke="#466ea3" stroke-width="2" rx="3"/><text x="647" y="113" font-family="monospace" font-size="14" text-anchor="middle">Workers</text><path d="M733 109 h13" stroke="#466ea3" stroke-width="2"/><rect x="746" y="78" width="168" height="61" fill="#f1f6fb" stroke="#466ea3" stroke-width="2" rx="3"/><text x="830" y="113" font-family="monospace" font-size="14" text-anchor="middle">Search</text><text x="20" y="192" font-family="monospace" font-size="14">Hot tenant → fair scheduling; outage → recovery margin.</text><text x="20" y="221" font-family="monospace" font-size="14">Deletion tombstone and regional policy constrain all read models.</text></svg>