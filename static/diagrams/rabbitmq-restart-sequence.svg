<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 925 255" role="img" aria-labelledby="t d"><title id="t">Durable message survives restart of RabbitMQ single node</title><desc id="d">A publisher writes a persistent message to a durable queue and waits for confirm. The same RabbitMQ container restarts and a new consumer reconnects, retrieves the identical event ID, then acknowledges the message. This is not multi-node failover.</desc><rect width="925" height="255" fill="white"/><text x="20" y="30" font-family="monospace" font-size="17">Confirmed persistent message across one-node restart</text><rect x="12" y="75" width="175" height="67" rx="3" fill="#f2f7fc" stroke="#486da2" stroke-width="2"/><text x="99" y="115" font-family="monospace" font-size="13" text-anchor="middle">Publish + confirm</text><path d="M188 108 h12" stroke="#486da2" stroke-width="2"/><rect x="197" y="75" width="175" height="67" rx="3" fill="#f2f7fc" stroke="#486da2" stroke-width="2"/><text x="284" y="115" font-family="monospace" font-size="13" text-anchor="middle">Stop broker</text><path d="M373 108 h12" stroke="#486da2" stroke-width="2"/><rect x="382" y="75" width="175" height="67" rx="3" fill="#dcecff" stroke="#486da2" stroke-width="2"/><text x="469" y="115" font-family="monospace" font-size="13" text-anchor="middle">Restart node</text><path d="M558 108 h12" stroke="#486da2" stroke-width="2"/><rect x="567" y="75" width="175" height="67" rx="3" fill="#f2f7fc" stroke="#486da2" stroke-width="2"/><text x="654" y="115" font-family="monospace" font-size="13" text-anchor="middle">Reconnect</text><path d="M743 108 h12" stroke="#486da2" stroke-width="2"/><rect x="752" y="75" width="175" height="67" rx="3" fill="#f2f7fc" stroke="#486da2" stroke-width="2"/><text x="839" y="115" font-family="monospace" font-size="13" text-anchor="middle">Read + ACK</text><text x="20" y="194" font-family="monospace" font-size="14">Queue durable + message persistent + publisher confirm</text><text x="20" y="227" font-family="monospace" font-size="14">Same-container restart != quorum replication or physical disaster.</text></svg>