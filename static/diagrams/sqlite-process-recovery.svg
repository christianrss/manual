<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-labelledby="t d"><title id="t">Two processes compete for one transactional SQLite authority</title><desc id="d">Two independent Python processes attempt to reserve two units from three. SQLite write transactions serialize the changes so only one reservation succeeds. A crash after commit does not delete the committed reservation and outbox row.</desc><rect width="920" height="250" fill="white"/><text x="20" y="30" font-family="monospace" font-size="17">Independent processes, one durable authority</text><rect x="35" y="73" width="235" height="60" fill="#ecf4ff" stroke="#436da1" stroke-width="2"/><rect x="35" y="160" width="235" height="60" fill="#ecf4ff" stroke="#436da1" stroke-width="2"/><text x="153" y="109" font-family="monospace" font-size="14" text-anchor="middle">Process A: reserve 2</text><text x="153" y="196" font-family="monospace" font-size="14" text-anchor="middle">Process B: reserve 2</text><rect x="440" y="99" width="431" height="91" fill="#e5f0fe" stroke="#436da1" stroke-width="2"/><text x="655" y="132" font-family="monospace" font-size="15" text-anchor="middle">SQLite file: stock = 3</text><text x="655" y="160" font-family="monospace" font-size="13" text-anchor="middle">BEGIN IMMEDIATE + conditional UPDATE</text><path d="M270 105 L436 130 M270 190 L436 161" fill="none" stroke="#436da1" stroke-width="2"/></svg>