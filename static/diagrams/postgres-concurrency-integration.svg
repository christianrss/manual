<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 255" role="img" aria-labelledby="t d"><title id="t">PostgreSQL concurrency and atomic outbox</title><desc id="d">Two independent application processes connect to the same PostgreSQL stock row. A conditional update serialized by the database allows exactly one two-unit reservation from three units. The winning transaction also persists an outbox event.</desc><rect width="920" height="255" fill="white"/><text x="20" y="30" font-family="monospace" font-size="17">Process isolation, one transaction authority</text><rect x="20" y="70" width="220" height="60" fill="#e7f2ff" stroke="#456ea2"/><rect x="20" y="154" width="220" height="60" fill="#e7f2ff" stroke="#456ea2"/><text x="130" y="104" font-family="monospace" font-size="14" text-anchor="middle">Client A: reserve 2</text><text x="130" y="189" font-family="monospace" font-size="14" text-anchor="middle">Client B: reserve 2</text><path d="M240 100 L430 120 M240 184 L430 152" fill="none" stroke="#456ea2" stroke-width="2"/><rect x="430" y="79" width="465" height="124" fill="#dfeeff" stroke="#456ea2" stroke-width="2"/><text x="665" y="112" font-family="monospace" font-size="16" text-anchor="middle">PostgreSQL: stock = 3</text><text x="665" y="148" font-family="monospace" font-size="14" text-anchor="middle">Conditional UPDATE + reservation</text><text x="665" y="174" font-family="monospace" font-size="14" text-anchor="middle">+ outbox: one local COMMIT</text><text x="23" y="240" font-family="monospace" font-size="13">One accepted, one insufficient; a client timeout may follow a completed commit.</text></svg>