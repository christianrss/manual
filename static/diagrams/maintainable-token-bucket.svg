<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" role="img" aria-labelledby="t d"><title id="t">Token bucket state updates and clock injection</title><desc id="d">An injected monotonic clock supplies elapsed time. A rate-per-second refill is capped by capacity and the allow decision subtracts cost only when sufficient tokens remain. HTTP adapters are separate.</desc><rect width="920" height="265" fill="white"/><text x="22" y="30" font-family="monospace" font-size="17">Deterministic time makes quota behavior testable</text><rect x="22" y="79" width="207" height="68" rx="4" fill="#f3f7fb" stroke="#426ba4" stroke-width="2"/><text x="125" y="116" text-anchor="middle" font-family="monospace" font-size="15">Clock</text><path d="M229 111 h15" stroke="#426ba4" stroke-width="2"/><rect x="244" y="79" width="207" height="68" rx="4" fill="#f3f7fb" stroke="#426ba4" stroke-width="2"/><text x="347" y="116" text-anchor="middle" font-family="monospace" font-size="15">Refill up to C</text><path d="M451 111 h15" stroke="#426ba4" stroke-width="2"/><rect x="466" y="79" width="207" height="68" rx="4" fill="#e0efff" stroke="#426ba4" stroke-width="2"/><text x="569" y="116" text-anchor="middle" font-family="monospace" font-size="15">Check cost</text><path d="M673 111 h15" stroke="#426ba4" stroke-width="2"/><rect x="688" y="79" width="207" height="68" rx="4" fill="#f3f7fb" stroke="#426ba4" stroke-width="2"/><text x="791" y="116" text-anchor="middle" font-family="monospace" font-size="15">Accept / reject</text><text x="22" y="193" font-family="monospace" font-size="14">0 ≤ tokens ≤ capacity; only accepted calls spend tokens.</text><text x="22" y="225" font-family="monospace" font-size="14">In-memory bucket is not globally authoritative across replicas.</text></svg>