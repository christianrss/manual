<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="t d"><title id="t">Binary search partition</title><desc id="d">Five indexed array cells; the first value greater than or equal to 2 is at index one. Lower bound is one, upper bound is four.</desc><rect width="760" height="240" fill="#fff"/><text x="20" y="28" fill="#333" font-family="monospace" font-size="17">a = [ 1, 2, 2, 2, 5 ]</text><text x="20" y="56" fill="#333" font-family="monospace" font-size="13">lower_bound(2) = 1 / upper_bound(2) = 4</text><rect x="68" y="100" width="104" height="58" fill="#e5e5e5" stroke="#555" stroke-width="1.5"/><text x="120" y="137" text-anchor="middle" fill="#111" font-family="monospace" font-size="20">1</text><text x="120" y="177" text-anchor="middle" fill="#555" font-family="monospace" font-size="12">i=0</text><rect x="193" y="100" width="104" height="58" fill="#e7effc" stroke="#555" stroke-width="1.5"/><text x="245" y="137" text-anchor="middle" fill="#111" font-family="monospace" font-size="20">2</text><text x="245" y="177" text-anchor="middle" fill="#555" font-family="monospace" font-size="12">i=1</text><rect x="318" y="100" width="104" height="58" fill="#e7effc" stroke="#555" stroke-width="1.5"/><text x="370" y="137" text-anchor="middle" fill="#111" font-family="monospace" font-size="20">2</text><text x="370" y="177" text-anchor="middle" fill="#555" font-family="monospace" font-size="12">i=2</text><rect x="443" y="100" width="104" height="58" fill="#e7effc" stroke="#555" stroke-width="1.5"/><text x="495" y="137" text-anchor="middle" fill="#111" font-family="monospace" font-size="20">2</text><text x="495" y="177" text-anchor="middle" fill="#555" font-family="monospace" font-size="12">i=3</text><rect x="568" y="100" width="104" height="58" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/><text x="620" y="137" text-anchor="middle" fill="#111" font-family="monospace" font-size="20">5</text><text x="620" y="177" text-anchor="middle" fill="#555" font-family="monospace" font-size="12">i=4</text><path d="M193 90 V77 H568 V90" stroke="#2156a8" stroke-width="2" fill="none"/><text x="380" y="71" font-family="monospace" text-anchor="middle" font-size="13" fill="#2156a8">values equal to 2</text></svg>