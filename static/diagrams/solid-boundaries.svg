<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="t d"><title id="t">Dependency inversion: policy and adapters</title><desc id="d">AlertRule depends on MessageSender contract. Both SMTP adapter and collecting fake implement the contract. Business policy need not import the adapter.</desc><rect width="820" height="260" fill="white"/><text x="18" y="28" font-family="monospace" font-size="16">Policy → behavior contract ← adapters</text><g stroke="#426aa4" stroke-width="2" fill="#ebf3ff"><rect x="27" y="80" width="210" height="70"/><rect x="291" y="80" width="229" height="70"/><rect x="584" y="53" width="208" height="51"/><rect x="584" y="132" width="208" height="51"/></g><g font-family="monospace" font-size="15" fill="#222" text-anchor="middle"><text x="132" y="120">AlertRule</text><text x="405" y="120">MessageSender</text><text x="688" y="85">SMTP adapter</text><text x="688" y="164">Test collector</text></g><g stroke="#426aa4" stroke-width="2" fill="none"><path d="M240 115 H285 M521 115 L580 80 M521 115 L580 157"/></g><text x="22" y="221" font-family="monospace" font-size="13">Domain policy is isolated from infrastructure and can be tested with a fake.</text></svg>