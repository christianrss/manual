<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="t d"><title id="t">Min-heap parent and child invariant</title><desc id="d">Root 1 with children 4 and 3, and deeper children 9, 8 and 7. Parent indices are floor of child index minus one divided by two.</desc><rect width="760" height="270" fill="#fff"/><text x="20" y="28" fill="#333" font-family="monospace" font-size="17">heap = [1, 4, 3, 9, 8, 7]</text><g stroke="#555" stroke-width="2"><path d="M380 69 L230 126 M380 69 L530 126 M230 126 L145 208 M230 126 L315 208 M530 126 L615 208"/></g><circle cx="380" cy="68" r="28" stroke="#2156a8" stroke-width="1.5" fill="#f6f9ff"/><text x="380" y="74" font-family="monospace" font-size="20" fill="#111" text-anchor="middle">1</text><text x="380" y="114" font-family="monospace" font-size="11" fill="#555" text-anchor="middle">i=0</text><circle cx="230" cy="126" r="28" stroke="#2156a8" stroke-width="1.5" fill="#f6f9ff"/><text x="230" y="132" font-family="monospace" font-size="20" fill="#111" text-anchor="middle">4</text><text x="230" y="172" font-family="monospace" font-size="11" fill="#555" text-anchor="middle">i=1</text><circle cx="530" cy="126" r="28" stroke="#2156a8" stroke-width="1.5" fill="#f6f9ff"/><text x="530" y="132" font-family="monospace" font-size="20" fill="#111" text-anchor="middle">3</text><text x="530" y="172" font-family="monospace" font-size="11" fill="#555" text-anchor="middle">i=2</text><circle cx="145" cy="208" r="28" stroke="#2156a8" stroke-width="1.5" fill="#f6f9ff"/><text x="145" y="214" font-family="monospace" font-size="20" fill="#111" text-anchor="middle">9</text><text x="145" y="254" font-family="monospace" font-size="11" fill="#555" text-anchor="middle">i=3</text><circle cx="315" cy="208" r="28" stroke="#2156a8" stroke-width="1.5" fill="#f6f9ff"/><text x="315" y="214" font-family="monospace" font-size="20" fill="#111" text-anchor="middle">8</text><text x="315" y="254" font-family="monospace" font-size="11" fill="#555" text-anchor="middle">i=4</text><circle cx="615" cy="208" r="28" stroke="#2156a8" stroke-width="1.5" fill="#f6f9ff"/><text x="615" y="214" font-family="monospace" font-size="20" fill="#111" text-anchor="middle">7</text><text x="615" y="254" font-family="monospace" font-size="11" fill="#555" text-anchor="middle">i=5</text></svg>