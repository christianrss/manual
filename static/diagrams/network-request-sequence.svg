<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-labelledby="t d"><title id="t">HTTPS request stages</title><desc id="d">Sequence of DNS resolution, TCP connection, TLS identity and session establishment, application HTTP request, and response.</desc><rect width="820" height="250" fill="white"/><text x="24" y="32" font-family="monospace" font-size="17" fill="#222">Cold HTTPS request: conceptual stages</text><rect x="18" y="82" width="148" height="65" stroke="#5475a0" fill="#e9f1fb"/><text x="92" y="119" font-size="13" font-family="monospace" text-anchor="middle" fill="#222">DNS</text><text x="171" y="118" font-size="17" fill="#235ca9">→</text><rect x="180" y="82" width="148" height="65" stroke="#5475a0" fill="#f7faff"/><text x="254" y="119" font-size="13" font-family="monospace" text-anchor="middle" fill="#222">TCP / QUIC</text><text x="333" y="118" font-size="17" fill="#235ca9">→</text><rect x="342" y="82" width="148" height="65" stroke="#5475a0" fill="#e9f1fb"/><text x="416" y="119" font-size="13" font-family="monospace" text-anchor="middle" fill="#222">TLS</text><text x="495" y="118" font-size="17" fill="#235ca9">→</text><rect x="504" y="82" width="148" height="65" stroke="#5475a0" fill="#f7faff"/><text x="578" y="119" font-size="13" font-family="monospace" text-anchor="middle" fill="#222">HTTP request</text><text x="657" y="118" font-size="17" fill="#235ca9">→</text><rect x="666" y="82" width="148" height="65" stroke="#5475a0" fill="#e9f1fb"/><text x="740" y="119" font-size="13" font-family="monospace" text-anchor="middle" fill="#222">HTTP response</text><text x="22" y="190" font-family="monospace" font-size="14" fill="#555">Connection reuse and QUIC can overlap or omit stages.</text><text x="22" y="218" font-family="monospace" font-size="14" fill="#555">DNS/TLS success does not prove business success.</text></svg>