<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 265" role="img" aria-labelledby="t d"><title id="t">Notification system architecture</title><desc id="d">API accepts an event and persists it with an outbox in a database transaction. A relay publishes to a durable broker. Workers dispatch through provider APIs and persist delivery status. Retries may duplicate attempts.</desc><rect width="1000" height="265" fill="white"/><text x="22" y="30" font-family="monospace" font-size="18">Accept → commit → publish → deliver → observe</text><rect x="16" y="76" width="147" height="62" fill="#f1f6fc" stroke="#476ca3" stroke-width="2" rx="3"/><text x="89" y="112" font-family="monospace" font-size="13" text-anchor="middle">API</text><path d="M165 107 h15" stroke="#476ca3" stroke-width="2"/><rect x="181" y="76" width="147" height="62" fill="#dceeff" stroke="#476ca3" stroke-width="2" rx="3"/><text x="254" y="112" font-family="monospace" font-size="13" text-anchor="middle">Event + outbox</text><path d="M330 107 h15" stroke="#476ca3" stroke-width="2"/><rect x="346" y="76" width="147" height="62" fill="#f1f6fc" stroke="#476ca3" stroke-width="2" rx="3"/><text x="419" y="112" font-family="monospace" font-size="13" text-anchor="middle">Relay</text><path d="M495 107 h15" stroke="#476ca3" stroke-width="2"/><rect x="511" y="76" width="147" height="62" fill="#f1f6fc" stroke="#476ca3" stroke-width="2" rx="3"/><text x="584" y="112" font-family="monospace" font-size="13" text-anchor="middle">Queue</text><path d="M660 107 h15" stroke="#476ca3" stroke-width="2"/><rect x="676" y="76" width="147" height="62" fill="#f1f6fc" stroke="#476ca3" stroke-width="2" rx="3"/><text x="749" y="112" font-family="monospace" font-size="13" text-anchor="middle">Workers</text><path d="M825 107 h15" stroke="#476ca3" stroke-width="2"/><rect x="841" y="76" width="147" height="62" fill="#f1f6fc" stroke="#476ca3" stroke-width="2" rx="3"/><text x="914" y="112" font-family="monospace" font-size="13" text-anchor="middle">Provider</text><text x="20" y="183" font-family="monospace" font-size="14">Event + outbox is ONE local transaction.</text><text x="20" y="212" font-family="monospace" font-size="14">Broker and provider steps may be repeated after crashes.</text><text x="20" y="239" font-family="monospace" font-size="14">Measure provider acknowledgment separately from HTTP acceptance.</text></svg>