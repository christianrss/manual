<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="t d"><title id="t">Binary search tree and inorder traversal</title><desc id="d">BST root eight has left subtree rooted three with children one and six, and right subtree rooted ten with right child fourteen. Inorder yields one three six eight ten fourteen.</desc><rect width="800" height="280" fill="white"/><text x="20" y="27" font-family="monospace" font-size="17">BST: left keys &lt; root &lt; right keys</text><g stroke="#777" fill="none" stroke-width="2"><path d="M400 72 L230 127 M400 72 L565 127 M230 127 L142 197 M230 127 L315 197 M565 127 L654 197"/></g><circle cx="400" cy="65" r="28" stroke="#416aaa" fill="#f0f5fc" stroke-width="2"/><text x="400" y="71" text-anchor="middle" font-family="monospace" font-size="18">8</text><circle cx="230" cy="130" r="28" stroke="#416aaa" fill="#f0f5fc" stroke-width="2"/><text x="230" y="136" text-anchor="middle" font-family="monospace" font-size="18">3</text><circle cx="565" cy="130" r="28" stroke="#416aaa" fill="#f0f5fc" stroke-width="2"/><text x="565" y="136" text-anchor="middle" font-family="monospace" font-size="18">10</text><circle cx="142" cy="197" r="28" stroke="#416aaa" fill="#f0f5fc" stroke-width="2"/><text x="142" y="203" text-anchor="middle" font-family="monospace" font-size="18">1</text><circle cx="315" cy="197" r="28" stroke="#416aaa" fill="#f0f5fc" stroke-width="2"/><text x="315" y="203" text-anchor="middle" font-family="monospace" font-size="18">6</text><circle cx="654" cy="197" r="28" stroke="#416aaa" fill="#f0f5fc" stroke-width="2"/><text x="654" y="203" text-anchor="middle" font-family="monospace" font-size="18">14</text><text x="20" y="266" font-family="monospace" font-size="15">Inorder = 1, 3, 6, 8, 10, 14</text></svg>