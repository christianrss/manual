<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 290" role="img" aria-labelledby="t d"><title id="t">Distributed trace across gateway service database</title><desc id="d">A request produces an end-to-end trace with a gateway span, a service child span, and a database child span; correlation identifiers connect logs and metrics.</desc><rect width="850" height="290" fill="#fff"/><text x="25" y="30" font-family="monospace" font-size="17" fill="#333">One trace ID, multiple spans</text><g fill="#eff4fd" stroke="#3763a1" stroke-width="2"><rect x="35" y="65" width="245" height="60"/><rect x="310" y="65" width="245" height="60"/><rect x="585" y="65" width="230" height="60"/></g><g font-family="monospace" font-size="17" fill="#111" text-anchor="middle"><text x="157" y="102">Gateway</text><text x="432" y="102">Application</text><text x="700" y="102">Database</text></g><g stroke="#3763a1" stroke-width="3" fill="none"><path d="M280 95 H300 l-10 -7 m10 7 l-10 7 M555 95 H575 l-10 -7 m10 7 l-10 7"/></g><g font-family="monospace" font-size="14" fill="#444"><text x="38" y="160">Span A: root</text><text x="310" y="160">Span B: child of A</text><text x="585" y="160">Span C: child of B</text><text x="35" y="210">traceparent travels with requests; correlated logs use trace ID</text><text x="35" y="244">Metrics summarize populations, not individual requests.</text></g></svg>