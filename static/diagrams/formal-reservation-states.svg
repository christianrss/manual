<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 270" role="img" aria-labelledby="t d"><title id="t">Model checking a concurrent reservation race</title><desc id="d">Two clients both check the same free seat, then both commit and violate single-owner safety. In an atomic commit model, a second commit must fail after the first succeeds.</desc><rect width="850" height="270" fill="white"/><text x="20" y="28" font-family="monospace" font-size="17" fill="#222">Unsafe check → commit interleaving</text><rect x="20" y="76" width="186" height="70" stroke="#496ba2" fill="#edf4ff" stroke-width="2"/><text x="113" y="116" font-family="monospace" font-size="14" text-anchor="middle">A checks free</text><rect x="226" y="76" width="186" height="70" stroke="#496ba2" fill="#edf4ff" stroke-width="2"/><text x="319" y="116" font-family="monospace" font-size="14" text-anchor="middle">B checks free</text><rect x="432" y="76" width="186" height="70" stroke="#496ba2" fill="#edf4ff" stroke-width="2"/><text x="525" y="116" font-family="monospace" font-size="14" text-anchor="middle">A commits</text><rect x="638" y="76" width="186" height="70" stroke="#b44" fill="#fff0f0" stroke-width="2"/><text x="731" y="116" font-family="monospace" font-size="14" text-anchor="middle">B commits</text><text x="24" y="185" font-family="monospace" font-size="15" fill="#a33">Two confirmed owners → invariant violated</text><text x="24" y="221" font-family="monospace" font-size="15" fill="#235c40">Atomic recheck at commit: second owner is rejected</text></svg>