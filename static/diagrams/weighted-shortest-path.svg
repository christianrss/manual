<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240"><title>Weighted graph for Dijkstra</title><desc>Source s to a weight 4, source s to b weight 1, b to a weight 2, a to target t weight 1, b to t weight 7.</desc><rect width="720" height="240" fill="white"/><g stroke="#777" stroke-width="2" fill="none"><path d="M90 120 L320 58 M90 120 L320 185 M320 185 L320 58 M320 58 L610 120 M320 185 L610 120"/></g><text x="200" y="74" font-family="monospace" font-size="16" fill="#222">4</text><text x="210" y="162" font-family="monospace" font-size="16" fill="#222">1</text><text x="334" y="123" font-family="monospace" font-size="16" fill="#222">2</text><text x="460" y="73" font-family="monospace" font-size="16" fill="#222">1</text><text x="460" y="182" font-family="monospace" font-size="16" fill="#222">7</text><circle cx="90" cy="120" r="28" stroke="#2357a0" stroke-width="2" fill="#ecf3ff"/><text x="90" y="126" text-anchor="middle" font-family="monospace" font-size="20">s</text><circle cx="320" cy="58" r="28" stroke="#2357a0" stroke-width="2" fill="#ecf3ff"/><text x="320" y="64" text-anchor="middle" font-family="monospace" font-size="20">a</text><circle cx="320" cy="185" r="28" stroke="#2357a0" stroke-width="2" fill="#ecf3ff"/><text x="320" y="191" text-anchor="middle" font-family="monospace" font-size="20">b</text><circle cx="610" cy="120" r="28" stroke="#2357a0" stroke-width="2" fill="#ecf3ff"/><text x="610" y="126" text-anchor="middle" font-family="monospace" font-size="20">t</text></svg>