<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" role="img" aria-labelledby="t d"><title id="t">Linked list reversal</title><desc id="d">Before reversal the nodes point one to two to three to none. After reversal three points to two to one to none.</desc><rect width="780" height="250" fill="white"/><text x="22" y="27" font-family="monospace" font-size="17">Reverse links without losing the suffix</text><rect x="50" y="60" width="122" height="55" stroke="#4268a0" fill="#eaf1fc"/><text x="111" y="95" text-anchor="middle" font-family="monospace" font-size="19">1</text><path d="M178 88 H257" stroke="#4268a0" stroke-width="3"/><rect x="270" y="60" width="122" height="55" stroke="#4268a0" fill="#eaf1fc"/><text x="331" y="95" text-anchor="middle" font-family="monospace" font-size="19">2</text><path d="M398 88 H477" stroke="#4268a0" stroke-width="3"/><rect x="490" y="60" width="122" height="55" stroke="#4268a0" fill="#eaf1fc"/><text x="551" y="95" text-anchor="middle" font-family="monospace" font-size="19">3</text><rect x="50" y="162" width="122" height="55" stroke="#4268a0" fill="#eaf1fc"/><text x="111" y="197" text-anchor="middle" font-family="monospace" font-size="19">3</text><path d="M178 190 H257" stroke="#4268a0" stroke-width="3"/><rect x="270" y="162" width="122" height="55" stroke="#4268a0" fill="#eaf1fc"/><text x="331" y="197" text-anchor="middle" font-family="monospace" font-size="19">2</text><path d="M398 190 H477" stroke="#4268a0" stroke-width="3"/><rect x="490" y="162" width="122" height="55" stroke="#4268a0" fill="#eaf1fc"/><text x="551" y="197" text-anchor="middle" font-family="monospace" font-size="19">1</text><text x="707" y="99" font-family="monospace" font-size="15">None</text><text x="707" y="201" font-family="monospace" font-size="15">None</text></svg>