<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-labelledby="t d"><title id="t">Tree levels, LCA and diameter</title><desc id="d">Root one has left child two and right child three. Node two has children four and five. Lowest common ancestor of four and five is two. Diameter from four to three has three edges.</desc><rect width="860" height="290" fill="white"/><text x="20" y="27" font-family="monospace" font-size="17">Level order [1], [2,3], [4,5]; LCA(4,5)=2</text><g stroke="#5472a5" stroke-width="2.5" fill="none"><path d="M425 69 L260 134 M425 69 L585 134 M260 134 L180 203 M260 134 L350 203"/></g><circle cx="425" cy="65" r="27" stroke="#5472a5" fill="#ecf4ff" stroke-width="2"/><text x="425" y="71" text-anchor="middle" font-family="monospace" font-size="18">1</text><circle cx="260" cy="134" r="27" stroke="#5472a5" fill="#ecf4ff" stroke-width="2"/><text x="260" y="140" text-anchor="middle" font-family="monospace" font-size="18">2</text><circle cx="585" cy="134" r="27" stroke="#5472a5" fill="#ecf4ff" stroke-width="2"/><text x="585" y="140" text-anchor="middle" font-family="monospace" font-size="18">3</text><circle cx="180" cy="203" r="27" stroke="#5472a5" fill="#ecf4ff" stroke-width="2"/><text x="180" y="209" text-anchor="middle" font-family="monospace" font-size="18">4</text><circle cx="350" cy="203" r="27" stroke="#5472a5" fill="#ecf4ff" stroke-width="2"/><text x="350" y="209" text-anchor="middle" font-family="monospace" font-size="18">5</text><text x="20" y="278" font-family="monospace" font-size="14">Diameter: path 4 → 2 → 1 → 3 uses 3 edges.</text></svg>