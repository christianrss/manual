<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 275" role="img" aria-labelledby="t d"><title id="t">Data sharding versus hot partition</title><desc id="d">Tenant keys are routed to three shards, but all requests for a single high-volume tenant remain in one shard, illustrating that adding shards does not spread a hot key.</desc><rect width="890" height="275" fill="white"/><text x="20" y="27" font-family="monospace" font-size="17">Shard placement is not the same as traffic balance</text><g stroke="#486da0" stroke-width="2" fill="#ecf3fc"><rect x="20" y="85" width="190" height="65"/><rect x="330" y="55" width="171" height="66"/><rect x="330" y="140" width="171" height="66"/><rect x="638" y="85" width="210" height="66"/></g><g font-family="monospace" font-size="15" text-anchor="middle"><text x="115" y="115">tenant keys</text><text x="416" y="92">Shard A</text><text x="416" y="176">Shard B</text><text x="742" y="121">Hot tenant</text></g><g stroke="#486da0" stroke-width="2" fill="none"><path d="M212 108 L327 88 M212 127 L327 170 M503 112 L634 118"/></g><text x="20" y="243" font-family="monospace" font-size="14">More shards do not split one tenant unless the partition key changes.</text></svg>