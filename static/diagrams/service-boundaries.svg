<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="t d"><title id="t">Service boundaries and authority</title><desc id="d">A modular monolith holds checkout, inventory and catalog as distinct modules within one deployment. Separate services preserve their own authority, but communication crosses a network and consistency boundary.</desc><rect width="900" height="250" fill="white"/><text x="18" y="28" font-family="monospace" font-size="17">Separate domain authority from deployment choice</text><rect x="18" y="55" width="403" height="146" fill="#f3f7fc" stroke="#436ca4" stroke-width="2"/><text x="33" y="77" font-family="monospace" font-size="13">One deployment</text><rect x="33" y="104" width="117" height="57" fill="#e1efff" stroke="#436ca4"/><text x="91" y="135" font-family="monospace" font-size="12" text-anchor="middle">Checkout</text><rect x="159" y="104" width="117" height="57" fill="#e1efff" stroke="#436ca4"/><text x="217" y="135" font-family="monospace" font-size="12" text-anchor="middle">Inventory</text><rect x="285" y="104" width="117" height="57" fill="#e1efff" stroke="#436ca4"/><text x="343" y="135" font-family="monospace" font-size="12" text-anchor="middle">Catalog</text><rect x="467" y="55" width="418" height="146" fill="#f3f7fc" stroke="#436ca4" stroke-width="2"/><text x="483" y="77" font-family="monospace" font-size="13">Independent deployments</text><rect x="485" y="104" width="119" height="57" fill="#e1efff" stroke="#436ca4"/><text x="544" y="135" font-family="monospace" font-size="12" text-anchor="middle">Checkout</text><rect x="613" y="104" width="119" height="57" fill="#e1efff" stroke="#436ca4"/><text x="672" y="135" font-family="monospace" font-size="12" text-anchor="middle">Inventory</text><rect x="741" y="104" width="119" height="57" fill="#e1efff" stroke="#436ca4"/><text x="800" y="135" font-family="monospace" font-size="12" text-anchor="middle">Catalog</text><text x="18" y="230" font-family="monospace" font-size="13">Remote calls create timeout ambiguity; ownership requires explicit contracts.</text></svg>