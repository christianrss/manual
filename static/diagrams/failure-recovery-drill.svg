<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" role="img" aria-labelledby="t d"><title id="t">Crash injection around order and outbox</title><desc id="d">Order plus outbox commit atomically; a crash before commit rolls back. A crash after commit but before response leaves durable rows. Publishing before marking delivered creates a duplicate window handled by receiver deduplication.</desc><rect width="920" height="265" fill="white"/><text x="18" y="28" font-family="monospace" font-size="17">Inject failure at each durable boundary</text><rect x="16" y="84" width="163" height="58" fill="#f0f5fc" stroke="#426da4" stroke-width="2"/><text x="97" y="116" font-family="monospace" text-anchor="middle" font-size="14">BEGIN</text><path d="M181 112 h14" stroke="#426da4" stroke-width="2"/><rect x="196" y="84" width="163" height="58" fill="#f0f5fc" stroke="#426da4" stroke-width="2"/><text x="277" y="116" font-family="monospace" text-anchor="middle" font-size="14">Write both</text><path d="M361 112 h14" stroke="#426da4" stroke-width="2"/><rect x="376" y="84" width="163" height="58" fill="#d8ecff" stroke="#426da4" stroke-width="2"/><text x="457" y="116" font-family="monospace" text-anchor="middle" font-size="14">COMMIT</text><path d="M541 112 h14" stroke="#426da4" stroke-width="2"/><rect x="556" y="84" width="163" height="58" fill="#f0f5fc" stroke="#426da4" stroke-width="2"/><text x="637" y="116" font-family="monospace" text-anchor="middle" font-size="14">Publish</text><path d="M721 112 h14" stroke="#426da4" stroke-width="2"/><rect x="736" y="84" width="163" height="58" fill="#f0f5fc" stroke="#426da4" stroke-width="2"/><text x="817" y="116" font-family="monospace" text-anchor="middle" font-size="14">Ack outbox</text><text x="22" y="185" font-family="monospace" font-size="14">Before commit: rollback both order and intent.</text><text x="22" y="214" font-family="monospace" font-size="14">After publish, before ack: retry may duplicate, never assume exactly once.</text></svg>