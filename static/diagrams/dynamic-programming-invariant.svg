<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t d"><title id="t">LCS recurrence table</title><desc id="d">A 3 by 3 table for prefixes of AB and BA, with final longest common subsequence length one.</desc><rect width="760" height="250" fill="#fff"/><text x="18" y="28" font-size="17" font-family="monospace" fill="#333">A = AB, B = BA</text><text x="22" y="58" font-size="13" font-family="monospace" fill="#333">dp[i][j]: LCS length of A[:i] and B[:j]</text><rect x="155" y="85" width="112" height="38" stroke="#777" fill="#fff"/><text x="211" y="110" font-size="18" font-family="monospace" text-anchor="middle">0</text><rect x="285" y="85" width="112" height="38" stroke="#777" fill="#fff"/><text x="341" y="110" font-size="18" font-family="monospace" text-anchor="middle">0</text><rect x="415" y="85" width="112" height="38" stroke="#777" fill="#fff"/><text x="471" y="110" font-size="18" font-family="monospace" text-anchor="middle">0</text><rect x="155" y="133" width="112" height="38" stroke="#777" fill="#fff"/><text x="211" y="158" font-size="18" font-family="monospace" text-anchor="middle">0</text><rect x="285" y="133" width="112" height="38" stroke="#777" fill="#fff"/><text x="341" y="158" font-size="18" font-family="monospace" text-anchor="middle">0</text><rect x="415" y="133" width="112" height="38" stroke="#777" fill="#fff"/><text x="471" y="158" font-size="18" font-family="monospace" text-anchor="middle">1</text><rect x="155" y="181" width="112" height="38" stroke="#777" fill="#fff"/><text x="211" y="206" font-size="18" font-family="monospace" text-anchor="middle">0</text><rect x="285" y="181" width="112" height="38" stroke="#777" fill="#fff"/><text x="341" y="206" font-size="18" font-family="monospace" text-anchor="middle">1</text><rect x="415" y="181" width="112" height="38" stroke="#777" fill="#ddecff"/><text x="471" y="206" font-size="18" font-family="monospace" text-anchor="middle">1</text><g fill="#555" font-family="monospace" font-size="13"><text x="211" y="77" text-anchor="middle">∅</text><text x="341" y="77" text-anchor="middle">B</text><text x="471" y="77" text-anchor="middle">A</text><text x="137" y="110" text-anchor="middle">∅</text><text x="137" y="158" text-anchor="middle">A</text><text x="137" y="206" text-anchor="middle">B</text></g><text x="568" y="205" font-size="15" fill="#2156a8" font-family="monospace">LCS = 1</text></svg>