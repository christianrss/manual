<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 284" role="img" aria-labelledby="t d"><title id="t">Mergesort divide and combine</title><desc id="d">Array five two eight one is divided into halves five two and eight one, then into singletons, and remerged as two five, one eight and finally one two five eight.</desc><rect width="850" height="284" fill="white"/><text x="20" y="29" font-family="monospace" font-size="17">Mergesort: divide, sort halves, merge</text><g font-family="monospace" font-size="17" text-anchor="middle" stroke="#4871a6" fill="#eaf2fd"><rect x="345" y="52" width="160" height="40"/><rect x="176" y="116" width="160" height="40"/><rect x="514" y="116" width="160" height="40"/><rect x="345" y="207" width="160" height="40"/></g><g font-family="monospace" font-size="16" text-anchor="middle" fill="#222"><text x="425" y="77">[5, 2, 8, 1]</text><text x="256" y="142">[5, 2]</text><text x="594" y="142">[8, 1]</text><text x="425" y="233">[1, 2, 5, 8]</text></g><g fill="none" stroke="#4871a6" stroke-width="2"><path d="M397 93 L285 113 M453 93 L565 113 M257 159 L398 203 M592 159 L450 203"/></g><text x="21" y="268" font-family="monospace" font-size="13">Every merge level scans O(n) elements; height O(log n).</text></svg>