<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-labelledby="t d"><title id="t">Different testing scopes and evidence</title><desc id="d">Unit tests verify local rules, integration tests verify real component boundaries, contract tests verify producer-consumer expectations, and E2E tests verify a critical user path. Each level leaves some risks unchecked.</desc><rect width="820" height="270" fill="white"/><text x="18" y="30" font-family="monospace" font-size="17">Testing scope is a claim about evidence</text><rect x="35" y="50" width="265" height="40" rx="3" stroke="#41699f" fill="#eaf2ff"/><text x="52" y="75" font-family="monospace" font-size="14">Unit: policy</text><rect x="58" y="107" width="323" height="40" rx="3" stroke="#41699f" fill="#eaf2ff"/><text x="75" y="132" font-family="monospace" font-size="14">Integration: DB/API</text><rect x="81" y="164" width="381" height="40" rx="3" stroke="#41699f" fill="#eaf2ff"/><text x="98" y="189" font-family="monospace" font-size="14">Contract: client↔provider</text><rect x="104" y="221" width="439" height="40" rx="3" stroke="#41699f" fill="#eaf2ff"/><text x="121" y="246" font-family="monospace" font-size="14">E2E: user workflow</text><text x="540" y="165" font-family="monospace" font-size="12">Broader ≠ exhaustive</text><text x="540" y="190" font-family="monospace" font-size="12">Control failure modes</text></svg>