<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 255" role="img" aria-labelledby="t d"><title id="t">Live RabbitMQ broker isolated from a bridge network</title><desc id="d">The mq1 node is stopped. mq2 runs and remains available to AMQP clients. mq3 also remains running but loses its Docker bridge connection, leaving no two-member majority. Reconnecting mq3 restores the communication path and confirmed publication.</desc><rect width="950" height="255" fill="white"/><text x="20" y="30" font-family="monospace" font-size="17">Network isolation != process shutdown</text><rect x="20" y="77" width="274" height="105" fill="#f7e8e3" stroke="#51729f" stroke-width="2"/><text x="157" y="118" text-anchor="middle" font-family="monospace" font-size="16">mq1: stopped</text><text x="157" y="147" text-anchor="middle" font-family="monospace" font-size="13">Already unavailable</text><rect x="337" y="77" width="272" height="105" fill="#e5f0ff" stroke="#51729f" stroke-width="2"/><text x="473" y="118" text-anchor="middle" font-family="monospace" font-size="16">mq2: running</text><text x="473" y="147" text-anchor="middle" font-family="monospace" font-size="13">Accepts AMQP login</text><rect x="653" y="77" width="273" height="105" fill="#f8eee1" stroke="#51729f" stroke-width="2"/><text x="789" y="118" text-anchor="middle" font-family="monospace" font-size="16">mq3: running</text><text x="789" y="147" text-anchor="middle" font-family="monospace" font-size="13">Bridge disconnected</text><text x="19" y="222" font-family="monospace" font-size="14">One reachable voter: no quorum confirm; reconnect to restore.</text></svg>