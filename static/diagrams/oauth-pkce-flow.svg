<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" role="img" aria-labelledby="t d"><title id="t">OAuth PKCE authorization code flow</title><desc id="d">A client sends an S256 code challenge at authorization, receives a code through a registered redirect, and redeems it with the matching secret verifier at the token endpoint.</desc><rect width="860" height="240" fill="white"/><text x="18" y="26" font-family="monospace" font-size="17" fill="#333">PKCE: authorization code is bound to its verifier</text><rect x="20" y="65" width="245" height="65" fill="#f1f6fe" stroke="#446ca3" stroke-width="2"/><text x="142" y="101" text-anchor="middle" font-family="monospace" font-size="14">Client</text><rect x="298" y="65" width="245" height="65" fill="#f1f6fe" stroke="#446ca3" stroke-width="2"/><text x="420" y="101" text-anchor="middle" font-family="monospace" font-size="14">Browser / redirect</text><rect x="581" y="65" width="245" height="65" fill="#f1f6fe" stroke="#446ca3" stroke-width="2"/><text x="703" y="101" text-anchor="middle" font-family="monospace" font-size="14">Authorization server</text><path d="M267 97 H290 M545 97 H574" stroke="#446ca3" stroke-width="2.5"/><text x="20" y="162" font-family="monospace" font-size="14">1. Challenge S256 is bound to the authorization request</text><text x="20" y="188" font-family="monospace" font-size="14">2. Redeem code + matching verifier at token endpoint</text><text x="20" y="214" font-family="monospace" font-size="14">3. Resource server validates issued access token separately</text></svg>