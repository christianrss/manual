<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250"><title>Backtracking with pruned search branches</title><desc>At root search branches to possible columns; an invalid branch is pruned while valid partial placements are explored further.</desc><rect width="760" height="250" fill="white"/><g stroke="#666" stroke-width="2"><path d="M380 42 L180 102 M380 42 L380 102 M380 42 L580 102 M180 125 L105 185 M180 125 L255 185 M580 125 L515 185 M580 125 L665 185"/></g><rect x="341" y="15" width="78" height="30" fill="#ebf2fd" stroke="#3763a1"/><text x="380" y="35" text-anchor="middle" font-size="12" font-family="monospace">start</text><rect x="141" y="97" width="78" height="30" fill="#ebf2fd" stroke="#3763a1"/><text x="180" y="117" text-anchor="middle" font-size="12" font-family="monospace">col 0</text><rect x="341" y="97" width="78" height="30" fill="#ebf2fd" stroke="#3763a1"/><text x="380" y="117" text-anchor="middle" font-size="12" font-family="monospace">col 1</text><rect x="541" y="97" width="78" height="30" fill="#ebf2fd" stroke="#3763a1"/><text x="580" y="117" text-anchor="middle" font-size="12" font-family="monospace">col 2</text><rect x="66" y="181" width="78" height="30" fill="#ebf2fd" stroke="#3763a1"/><text x="105" y="201" text-anchor="middle" font-size="12" font-family="monospace">valid</text><rect x="216" y="181" width="78" height="30" fill="#fce7e7" stroke="#a33"/><text x="255" y="201" text-anchor="middle" font-size="12" font-family="monospace">prune</text><rect x="476" y="181" width="78" height="30" fill="#ebf2fd" stroke="#3763a1"/><text x="515" y="201" text-anchor="middle" font-size="12" font-family="monospace">valid</text><rect x="626" y="181" width="78" height="30" fill="#fce7e7" stroke="#a33"/><text x="665" y="201" text-anchor="middle" font-size="12" font-family="monospace">prune</text></svg>