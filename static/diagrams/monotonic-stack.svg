<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="t d"><title id="t">Monotonic stack values and next greater element</title><desc id="d">Decreasing pending values two and one are both resolved when value three arrives. Every index is pushed once and popped once.</desc><rect width="820" height="260" fill="white"/><text x="20" y="30" font-family="monospace" font-size="18">Before 3: pending [2,1] → after 3: pending [3]</text><rect x="80" y="78" width="130" height="52" stroke="#41689e" fill="#e4efff"/><text x="145" y="111" text-anchor="middle" font-family="monospace" font-size="18">2</text><rect x="80" y="141" width="130" height="52" stroke="#41689e" fill="#e4efff"/><text x="145" y="174" text-anchor="middle" font-family="monospace" font-size="18">1</text><rect x="480" y="78" width="130" height="52" stroke="#41689e" fill="#e4efff"/><text x="545" y="111" text-anchor="middle" font-family="monospace" font-size="18">3</text><text x="290" y="127" font-size="28">→</text><text x="20" y="233" font-family="monospace" font-size="13">Both older indices resolve at current index; each is popped once.</text></svg>