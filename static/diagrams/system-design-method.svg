<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 255" role="img" aria-labelledby="t d"><title id="t">System design method</title><desc id="d">Requirements lead to workload assumptions, API and data contracts, a minimum architecture, failure analysis, and validation. Results feed back into requirements.</desc><rect width="930" height="255" fill="white"/><text x="24" y="32" font-size="18" font-family="monospace">System design is a sequence of testable decisions</text><rect x="23" y="78" width="134" height="58" stroke="#466da3" stroke-width="2" rx="4" fill="#eaf2fe"/><text x="90" y="112" font-size="15" font-family="monospace" text-anchor="middle">Scope</text><path d="M158 107 h14" stroke="#466da3" stroke-width="2"/><rect x="174" y="78" width="134" height="58" stroke="#466da3" stroke-width="2" rx="4" fill="#eaf2fe"/><text x="241" y="112" font-size="15" font-family="monospace" text-anchor="middle">Quantify</text><path d="M309 107 h14" stroke="#466da3" stroke-width="2"/><rect x="325" y="78" width="134" height="58" stroke="#466da3" stroke-width="2" rx="4" fill="#eaf2fe"/><text x="392" y="112" font-size="15" font-family="monospace" text-anchor="middle">Contracts</text><path d="M460 107 h14" stroke="#466da3" stroke-width="2"/><rect x="476" y="78" width="134" height="58" stroke="#466da3" stroke-width="2" rx="4" fill="#eaf2fe"/><text x="543" y="112" font-size="15" font-family="monospace" text-anchor="middle">Architecture</text><path d="M611 107 h14" stroke="#466da3" stroke-width="2"/><rect x="627" y="78" width="134" height="58" stroke="#466da3" stroke-width="2" rx="4" fill="#eaf2fe"/><text x="694" y="112" font-size="15" font-family="monospace" text-anchor="middle">Failures</text><path d="M762 107 h14" stroke="#466da3" stroke-width="2"/><rect x="778" y="78" width="134" height="58" stroke="#466da3" stroke-width="2" rx="4" fill="#eaf2fe"/><text x="845" y="112" font-size="15" font-family="monospace" text-anchor="middle">Validate</text><text x="24" y="190" font-size="14" font-family="monospace">Every new component needs a requirement or measured constraint.</text><text x="24" y="219" font-size="14" font-family="monospace">SLOs and failure tests close the design feedback loop.</text></svg>