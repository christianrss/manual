<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 285" role="img" aria-labelledby="t d"><title id="t">Hybrid social feed fanout</title><desc id="d">Normal authors push post identifiers into follower inboxes at write time. High-follower authors are read on demand. Feed API combines inbox identifiers with read-on-demand post candidates and then checks visibility.</desc><rect width="940" height="285" fill="white"/><text x="20" y="31" font-family="monospace" font-size="17">Hybrid: materialize small fanouts; pull large fanouts</text><rect x="22" y="74" width="222" height="58" fill="#f2f6fc" stroke="#456d9d" stroke-width="2" rx="4"/><text x="133" y="109" font-family="monospace" font-size="14" text-anchor="middle">Ordinary author</text><rect x="295" y="74" width="222" height="58" fill="#f2f6fc" stroke="#456d9d" stroke-width="2" rx="4"/><text x="406" y="109" font-family="monospace" font-size="14" text-anchor="middle">Push inbox</text><rect x="22" y="169" width="222" height="58" fill="#f2f6fc" stroke="#456d9d" stroke-width="2" rx="4"/><text x="133" y="204" font-family="monospace" font-size="14" text-anchor="middle">High-fanout author</text><rect x="295" y="169" width="222" height="58" fill="#f2f6fc" stroke="#456d9d" stroke-width="2" rx="4"/><text x="406" y="204" font-family="monospace" font-size="14" text-anchor="middle">Pull candidates</text><rect x="620" y="120" width="294" height="58" fill="#e0eeff" stroke="#456d9d" stroke-width="2" rx="4"/><text x="767" y="155" font-family="monospace" font-size="14" text-anchor="middle">Feed merge + ACL</text><g stroke="#456d9d" stroke-width="2" fill="none"><path d="M245 103 H292 M245 198 H292 M518 103 L616 147 M518 198 L616 154"/></g><text x="20" y="265" font-family="monospace" font-size="14">Home inbox is derived; post and follow graph remain authoritative.</text></svg>