<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="t d"><title id="t">RabbitMQ majority loss and recovery</title><desc id="d">A three member queue can publish with two members. If a second member stops, one live node has no quorum, so publishes must not receive a positive confirmation. Restarting a second member restores a majority and permits confirmed publishes.</desc><rect width="960" height="270" fill="white"/><text x="20" y="27" font-family="monospace" font-size="17">Three-member quorum: majority requires two</text><rect x="17" y="78" width="293" height="110" rx="5" fill="#e6f5ee" stroke="#4a6c92" stroke-width="2"/><text x="163" y="116" text-anchor="middle" font-family="monospace" font-size="19">2 / 3 alive</text><text x="163" y="158" text-anchor="middle" font-family="monospace" font-size="15">Confirm writes</text><rect x="336" y="78" width="293" height="110" rx="5" fill="#fbeae6" stroke="#4a6c92" stroke-width="2"/><text x="482" y="116" text-anchor="middle" font-family="monospace" font-size="19">1 / 3 alive</text><text x="482" y="158" text-anchor="middle" font-family="monospace" font-size="15">No positive confirm</text><rect x="655" y="78" width="293" height="110" rx="5" fill="#e6f5ee" stroke="#4a6c92" stroke-width="2"/><text x="801" y="116" text-anchor="middle" font-family="monospace" font-size="19">2 / 3 restored</text><text x="801" y="158" text-anchor="middle" font-family="monospace" font-size="15">Confirm again</text><text x="20" y="237" font-family="monospace" font-size="14">No confirm means UNKNOWN outcome; retry with stable event identity.</text></svg>