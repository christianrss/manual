<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" role="img" aria-labelledby="t d"><title id="t">Idempotent request timeline</title><desc id="d">First client request with key K commits. The reply is lost. Retried request with the same key reads committed result without repeating business effect.</desc><rect width="850" height="280" fill="white"/><text x="25" y="28" font-size="17" font-family="monospace">Ambiguous success and safe retry</text><g font-family="monospace" font-size="14"><text x="36" y="60">Client</text><text x="405" y="60">API + database</text></g><g stroke="#777" stroke-width="2"><path d="M87 75 V250 M485 75 V250"/></g><g stroke="#285ba0" stroke-width="2" fill="none"><path d="M89 100 H482 M482 187 H89"/></g><g font-family="monospace" font-size="13" fill="#222"><text x="160" y="93">POST key=K, payload=P</text><text x="510" y="122">Commit effect + K</text><text x="510" y="142">Reply lost ✕</text><text x="150" y="180">Retry same K and P</text><text x="510" y="207">Look up K; no new effect</text><text x="140" y="230">Return stored result</text></g></svg>