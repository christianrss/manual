<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 276" role="img" aria-labelledby="t d"><title id="t">Storage selection by access pattern</title><desc id="d">Transactions and inventory are owned by a relational database, catalog lookups may use a document or key value model, images live in object storage, and search is a derived read model.</desc><rect width="950" height="276" fill="white"/><text x="22" y="30" font-family="monospace" font-size="17">Choose the authority from the invariant and query shape</text><rect x="18" y="79" width="215" height="115" rx="5" stroke="#4772a7" stroke-width="2" fill="#e1edff"/><text x="125" y="114" text-anchor="middle" font-family="monospace" font-size="15">Order + stock</text><text x="125" y="163" text-anchor="middle" font-family="monospace" font-size="14">Relational</text><rect x="251" y="79" width="215" height="115" rx="5" stroke="#4772a7" stroke-width="2" fill="#f3f7fc"/><text x="358" y="114" text-anchor="middle" font-family="monospace" font-size="15">Catalog item</text><text x="358" y="163" text-anchor="middle" font-family="monospace" font-size="14">Document / KV</text><rect x="484" y="79" width="215" height="115" rx="5" stroke="#4772a7" stroke-width="2" fill="#f3f7fc"/><text x="591" y="114" text-anchor="middle" font-family="monospace" font-size="15">Product photos</text><text x="591" y="163" text-anchor="middle" font-family="monospace" font-size="14">Object store</text><rect x="717" y="79" width="215" height="115" rx="5" stroke="#4772a7" stroke-width="2" fill="#f3f7fc"/><text x="824" y="114" text-anchor="middle" font-family="monospace" font-size="15">Search results</text><text x="824" y="163" text-anchor="middle" font-family="monospace" font-size="14">Derived index</text><text x="22" y="231" font-family="monospace" font-size="14">Physical storage, indexes, backups and replication require separate sizing.</text><text x="22" y="254" font-family="monospace" font-size="14">Derived search/caches do not become payment or inventory authority.</text></svg>