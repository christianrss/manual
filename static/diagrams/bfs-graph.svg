<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-labelledby="title desc"><title id="title">Breadth-first search shortest path example</title><desc id="desc">Graph with A connected to B,C, B to D, C to E, D and E to F. BFS layers are zero, one, two and three.</desc><style>text{font:14px system-ui,Arial;fill:#222}.edge{stroke:#777;stroke-width:1.6}.node{fill:white;stroke:#333;stroke-width:1.8}.layer{font:12px system-ui,Arial;fill:#666}</style><text x="10" y="16" class="layer">Layer 0</text><text x="168" y="16" class="layer">Layer 1</text><text x="329" y="16" class="layer">Layer 2</text><text x="486" y="16" class="layer">Layer 3</text><g class="edge"><line x1="88" y1="117" x2="222" y2="67"/><line x1="88" y1="117" x2="222" y2="170"/><line x1="222" y1="67" x2="383" y2="67"/><line x1="222" y1="170" x2="383" y2="170"/><line x1="383" y1="67" x2="548" y2="117"/><line x1="383" y1="170" x2="548" y2="117"/></g><g class="node"><circle cx="88" cy="117" r="22"/><circle cx="222" cy="67" r="22"/><circle cx="222" cy="170" r="22"/><circle cx="383" cy="67" r="22"/><circle cx="383" cy="170" r="22"/><circle cx="548" cy="117" r="22"/></g><g text-anchor="middle"><text x="88" y="122">A</text><text x="222" y="72">B</text><text x="222" y="175">C</text><text x="383" y="72">D</text><text x="383" y="175">E</text><text x="548" y="122">F</text></g></svg>
