<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 955 280" role="img" aria-labelledby="t d"><title id="t">Multi tenant webhook delivery architecture</title><desc id="d">Application commits event and outbox, relay publishes to broker, subscription dispatcher creates unique event-subscription deliveries, tenant-fair workers call external endpoints. Retry decisions are durable and the result is observable.</desc><rect width="955" height="280" fill="white"/><text x="22" y="28" font-family="monospace" font-size="17">At-least-once attempts require durable identity and fairness</text><rect x="15" y="78" width="144" height="62" rx="4" fill="#e1edff" stroke="#4670a5" stroke-width="2"/><text x="87" y="116" font-family="monospace" font-size="13" text-anchor="middle">Event+outbox</text><path d="M161 108 H172" stroke="#4670a5" stroke-width="2"/><rect x="172" y="78" width="144" height="62" rx="4" fill="#f4f7fc" stroke="#4670a5" stroke-width="2"/><text x="244" y="116" font-family="monospace" font-size="13" text-anchor="middle">Relay</text><path d="M318 108 H329" stroke="#4670a5" stroke-width="2"/><rect x="329" y="78" width="144" height="62" rx="4" fill="#f4f7fc" stroke="#4670a5" stroke-width="2"/><text x="401" y="116" font-family="monospace" font-size="13" text-anchor="middle">Broker</text><path d="M475 108 H486" stroke="#4670a5" stroke-width="2"/><rect x="486" y="78" width="144" height="62" rx="4" fill="#e1edff" stroke="#4670a5" stroke-width="2"/><text x="558" y="116" font-family="monospace" font-size="13" text-anchor="middle">Delivery keys</text><path d="M632 108 H643" stroke="#4670a5" stroke-width="2"/><rect x="643" y="78" width="144" height="62" rx="4" fill="#f4f7fc" stroke="#4670a5" stroke-width="2"/><text x="715" y="116" font-family="monospace" font-size="13" text-anchor="middle">Fair workers</text><path d="M789 108 H800" stroke="#4670a5" stroke-width="2"/><rect x="800" y="78" width="144" height="62" rx="4" fill="#f4f7fc" stroke="#4670a5" stroke-width="2"/><text x="872" y="116" font-family="monospace" font-size="13" text-anchor="middle">Endpoints</text><text x="22" y="194" font-family="monospace" font-size="14">Unique (event, subscription) deduplicates logical fanout.</text><text x="22" y="222" font-family="monospace" font-size="14">Receiver processing is outside dispatcher transaction authority.</text><text x="22" y="250" font-family="monospace" font-size="14">Queues need finite retry, tenant isolation and measured drain capacity.</text></svg>