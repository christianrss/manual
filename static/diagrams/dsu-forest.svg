<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230"><title>Forest representing connected components</title><desc>Two components with roots 0 and 3, children 1, 2 and 4 respectively.</desc><rect width="720" height="230" fill="white"/><text x="20" y="28" font-family="monospace" font-size="16">parent[root] = root; union joins roots</text><g fill="none" stroke="#444" stroke-width="2"><path d="M180 83 L120 153 M180 83 L235 153 M500 83 L500 153"/></g><circle cx="180" cy="83" r="25" stroke="#2357a0" stroke-width="2" fill="#e9f0fb"/><text x="180" y="89" text-anchor="middle" font-family="monospace" font-size="18">0</text><circle cx="120" cy="153" r="25" stroke="#2357a0" stroke-width="2" fill="#e9f0fb"/><text x="120" y="159" text-anchor="middle" font-family="monospace" font-size="18">1</text><circle cx="235" cy="153" r="25" stroke="#2357a0" stroke-width="2" fill="#e9f0fb"/><text x="235" y="159" text-anchor="middle" font-family="monospace" font-size="18">2</text><circle cx="500" cy="83" r="25" stroke="#2357a0" stroke-width="2" fill="#e9f0fb"/><text x="500" y="89" text-anchor="middle" font-family="monospace" font-size="18">3</text><circle cx="500" cy="153" r="25" stroke="#2357a0" stroke-width="2" fill="#e9f0fb"/><text x="500" y="159" text-anchor="middle" font-family="monospace" font-size="18">4</text><text x="183" y="210" text-anchor="middle" font-family="monospace" font-size="13">Component A</text><text x="500" y="210" text-anchor="middle" font-family="monospace" font-size="13">Component B</text></svg>