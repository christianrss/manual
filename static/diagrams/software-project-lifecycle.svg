<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 250" role="img" aria-labelledby="t d"><title id="t">End to end engineering lifecycle</title><desc id="d">Discovery leads to design, implementation, review and tests, release and operations. Feedback from production creates new requirements, closing the loop.</desc><rect width="930" height="250" fill="white"/><text x="22" y="30" font-size="18" font-family="monospace">Delivery is a loop, not a merge button</text><rect x="19" y="78" width="132" height="59" rx="4" fill="#e8f2ff" stroke="#486b9e" stroke-width="2"/><text x="85" y="112" font-family="monospace" font-size="14" text-anchor="middle">Discover</text><path d="M153 106 H170" stroke="#486b9e" stroke-width="2"/><rect x="171" y="78" width="132" height="59" rx="4" fill="#e8f2ff" stroke="#486b9e" stroke-width="2"/><text x="237" y="112" font-family="monospace" font-size="14" text-anchor="middle">Design</text><path d="M305 106 H322" stroke="#486b9e" stroke-width="2"/><rect x="323" y="78" width="132" height="59" rx="4" fill="#e8f2ff" stroke="#486b9e" stroke-width="2"/><text x="389" y="112" font-family="monospace" font-size="14" text-anchor="middle">Build</text><path d="M457 106 H474" stroke="#486b9e" stroke-width="2"/><rect x="475" y="78" width="132" height="59" rx="4" fill="#e8f2ff" stroke="#486b9e" stroke-width="2"/><text x="541" y="112" font-family="monospace" font-size="14" text-anchor="middle">Verify</text><path d="M609 106 H626" stroke="#486b9e" stroke-width="2"/><rect x="627" y="78" width="132" height="59" rx="4" fill="#e8f2ff" stroke="#486b9e" stroke-width="2"/><text x="693" y="112" font-family="monospace" font-size="14" text-anchor="middle">Release</text><path d="M761 106 H778" stroke="#486b9e" stroke-width="2"/><rect x="779" y="78" width="132" height="59" rx="4" fill="#e8f2ff" stroke="#486b9e" stroke-width="2"/><text x="845" y="112" font-family="monospace" font-size="14" text-anchor="middle">Operate</text><path d="M836 144 v45 H86 v-45" fill="none" stroke="#486b9e" stroke-width="2"/><text x="330" y="213" font-family="monospace" font-size="14">Feedback, incidents, and new evidence</text></svg>