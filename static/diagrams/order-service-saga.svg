<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" role="img" aria-labelledby="t d"><title id="t">Checkout architecture with local stock transaction and payment saga</title><desc id="d">Checkout API atomically reserves inventory and commits order and outbox. Relay publishes payment command. Worker communicates with payment provider and moves order state after durable results, with compensation on failure.</desc><rect width="940" height="260" fill="white"/><text x="18" y="29" font-family="monospace" font-size="17">Atomic local reserve → asynchronous external payment</text><rect x="22" y="82" width="170" height="64" rx="3" stroke="#466da4" stroke-width="2" fill="#f3f7fc"/><text x="107" y="118" text-anchor="middle" font-family="monospace" font-size="14">Checkout API</text><path d="M194 114 h11" stroke="#466da4" stroke-width="2"/><rect x="207" y="82" width="170" height="64" rx="3" stroke="#466da4" stroke-width="2" fill="#e1eeff"/><text x="292" y="118" text-anchor="middle" font-family="monospace" font-size="14">Orders + stock</text><path d="M379 114 h11" stroke="#466da4" stroke-width="2"/><rect x="392" y="82" width="170" height="64" rx="3" stroke="#466da4" stroke-width="2" fill="#f3f7fc"/><text x="477" y="118" text-anchor="middle" font-family="monospace" font-size="14">Outbox + queue</text><path d="M564 114 h11" stroke="#466da4" stroke-width="2"/><rect x="577" y="82" width="170" height="64" rx="3" stroke="#466da4" stroke-width="2" fill="#f3f7fc"/><text x="662" y="118" text-anchor="middle" font-family="monospace" font-size="14">Payment worker</text><path d="M749 114 h11" stroke="#466da4" stroke-width="2"/><rect x="762" y="82" width="170" height="64" rx="3" stroke="#466da4" stroke-width="2" fill="#f3f7fc"/><text x="847" y="118" text-anchor="middle" font-family="monospace" font-size="14">PSP</text><text x="18" y="193" font-family="monospace" font-size="14">Stock reservation, order identity and outbox commit together.</text><text x="18" y="224" font-family="monospace" font-size="14">Provider outcome can be ambiguous; reconcile and compensate.</text></svg>