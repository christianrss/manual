<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 250" role="img" aria-labelledby="t d"><title id="t">Release pipeline with canary</title><desc id="d">Source commit passes build and tests into an immutable artifact, then canary evaluation decides whether to expand rollout or rollback. Schema migrations must preserve backward compatibility across active versions.</desc><rect width="930" height="250" fill="white"/><text x="22" y="30" font-family="monospace" font-size="18">One immutable artifact, explicit promotion gates</text><rect x="17" y="81" width="137" height="60" fill="#ebf3ff" stroke="#4671a3" rx="4"/><text x="86" y="116" font-family="monospace" font-size="14" text-anchor="middle">Commit</text><path d="M155 109 h12" stroke="#4671a3" stroke-width="2"/><rect x="169" y="81" width="137" height="60" fill="#ebf3ff" stroke="#4671a3" rx="4"/><text x="238" y="116" font-family="monospace" font-size="14" text-anchor="middle">Build+test</text><path d="M307 109 h12" stroke="#4671a3" stroke-width="2"/><rect x="321" y="81" width="137" height="60" fill="#ebf3ff" stroke="#4671a3" rx="4"/><text x="390" y="116" font-family="monospace" font-size="14" text-anchor="middle">Artifact</text><path d="M459 109 h12" stroke="#4671a3" stroke-width="2"/><rect x="473" y="81" width="137" height="60" fill="#ebf3ff" stroke="#4671a3" rx="4"/><text x="542" y="116" font-family="monospace" font-size="14" text-anchor="middle">Canary</text><path d="M611 109 h12" stroke="#4671a3" stroke-width="2"/><rect x="625" y="81" width="137" height="60" fill="#ebf3ff" stroke="#4671a3" rx="4"/><text x="694" y="116" font-family="monospace" font-size="14" text-anchor="middle">Evaluate</text><path d="M763 109 h12" stroke="#4671a3" stroke-width="2"/><rect x="777" y="81" width="137" height="60" fill="#ebf3ff" stroke="#4671a3" rx="4"/><text x="846" y="116" font-family="monospace" font-size="14" text-anchor="middle">Expand</text><path d="M688 145 v38 h-200" fill="none" stroke="#4671a3" stroke-width="2"/><text x="288" y="191" font-family="monospace" font-size="14">rollback or hold if unsafe</text><text x="22" y="230" font-family="monospace" font-size="13">Database expand/contract remains compatible during a mixed-version rollout.</text></svg>