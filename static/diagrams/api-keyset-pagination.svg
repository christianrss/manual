<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 245" role="img" aria-labelledby="t d"><title id="t">Keyset pagination by composite cursor</title><desc id="d">Five notes ordered newest first by timestamp and unique ID. The first page ends after the third note. An exclusive composite cursor retrieves the following two notes.</desc><rect width="870" height="245" fill="white"/><text x="20" y="29" font-family="monospace" font-size="17">ORDER BY created_at DESC, id DESC</text><rect x="20" y="76" width="157" height="60" fill="#e4efff" stroke="#4770a3"/><text x="98" y="112" font-family="monospace" text-anchor="middle" font-size="17">(12, 8)</text><rect x="191" y="76" width="157" height="60" fill="#e4efff" stroke="#4770a3"/><text x="269" y="112" font-family="monospace" text-anchor="middle" font-size="17">(12, 7)</text><rect x="362" y="76" width="157" height="60" fill="#e4efff" stroke="#4770a3"/><text x="440" y="112" font-family="monospace" text-anchor="middle" font-size="17">(11, 4)</text><rect x="533" y="76" width="157" height="60" fill="#f6f7f9" stroke="#4770a3"/><text x="611" y="112" font-family="monospace" text-anchor="middle" font-size="17">(10, 9)</text><rect x="704" y="76" width="157" height="60" fill="#f6f7f9" stroke="#4770a3"/><text x="782" y="112" font-family="monospace" text-anchor="middle" font-size="17">(10, 2)</text><path d="M524 146 V177" stroke="#466daa" stroke-width="2"/><text x="20" y="177" font-family="monospace" font-size="14">Page 1: three records, last=(11,4)</text><text x="20" y="210" font-family="monospace" font-size="14">Page 2: WHERE (created_at,id) &lt; (11,4)</text></svg>