<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 263" role="img" aria-labelledby="t d"><title id="t">Two pointer pair and prefix boundaries</title><desc id="d">Two pointers inspect the smallest and largest remaining numbers in a sorted array. Prefix P of length n plus one yields a half-open interval sum by subtracting P at its endpoints.</desc><rect width="850" height="263" fill="white"/><text x="22" y="26" font-size="17" font-family="monospace">Sorted pair candidates / prefix query boundaries</text><rect x="35" y="61" width="135" height="65" fill="#f7f7f7" stroke="#4770a5" stroke-width="2"/><text x="102" y="99" text-anchor="middle" font-size="20" font-family="monospace">-4</text><rect x="191" y="61" width="135" height="65" fill="#e3efff" stroke="#4770a5" stroke-width="2"/><text x="258" y="99" text-anchor="middle" font-size="20" font-family="monospace">-1</text><rect x="347" y="61" width="135" height="65" fill="#f7f7f7" stroke="#4770a5" stroke-width="2"/><text x="414" y="99" text-anchor="middle" font-size="20" font-family="monospace">2</text><rect x="503" y="61" width="135" height="65" fill="#e3efff" stroke="#4770a5" stroke-width="2"/><text x="570" y="99" text-anchor="middle" font-size="20" font-family="monospace">5</text><rect x="659" y="61" width="135" height="65" fill="#f7f7f7" stroke="#4770a5" stroke-width="2"/><text x="726" y="99" text-anchor="middle" font-size="20" font-family="monospace">9</text><text x="187" y="151" font-family="monospace" font-size="14">left=1</text><text x="497" y="151" font-family="monospace" font-size="14">right=3</text><text x="22" y="187" font-family="monospace" font-size="14">-1 + 5 = 4</text><text x="22" y="223" font-family="monospace" font-size="14">P=[0,3,1,6,7]; sum([1,3)) = P[3]−P[1] = 3</text></svg>