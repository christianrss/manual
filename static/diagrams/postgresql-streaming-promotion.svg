<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" role="img" aria-labelledby="t d"><title id="t">PostgreSQL streaming replication and promotion</title><desc id="d">Primary PostgreSQL commits a probe row. WAL streaming replays it on a standby with separate data volume. The primary is intentionally stopped, standby is promoted and then commits a new row.</desc><rect width="940" height="250" fill="white"/><text x="22" y="30" font-family="monospace" font-size="18">Observe replay before manual promotion</text><rect x="16" y="70" width="282" height="102" fill="#ecf4ff" stroke="#4773a3" stroke-width="2"/><text x="157" y="104" font-family="monospace" text-anchor="middle" font-size="16">Primary</text><text x="157" y="136" font-family="monospace" text-anchor="middle" font-size="14">COMMIT marker id=1</text><path d="M299 125 H608" stroke="#4773a3" stroke-width="3"/><text x="455" y="111" font-family="monospace" text-anchor="middle" font-size="14">WAL → replay</text><rect x="608" y="70" width="308" height="102" fill="#dcf0ff" stroke="#4773a3" stroke-width="2"/><text x="762" y="103" font-family="monospace" text-anchor="middle" font-size="16">Standby</text><text x="762" y="136" font-family="monospace" text-anchor="middle" font-size="14">Promote → INSERT id=2</text><text x="22" y="214" font-family="monospace" font-size="14">Stop old primary first. This is not automatic fencing or zero-loss proof.</text></svg>