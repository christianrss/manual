<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" role="img" aria-labelledby="t d"><title id="t">Stack versus queue</title><desc id="d">Stack pops from the last inserted item C, while FIFO queue dequeues the first inserted item A.</desc><rect width="780" height="250" fill="white"/><text x="20" y="27" font-family="monospace" font-size="17">Same arrivals A, B, C; different retrieval contracts</text><text x="58" y="72" font-family="monospace" font-size="17">Stack (LIFO)</text><text x="420" y="72" font-family="monospace" font-size="17">Queue (FIFO)</text><rect x="63" y="190" width="135" height="36" fill="#e8f1fe" stroke="#466aa0"/><text x="130" y="214" font-family="monospace" text-anchor="middle">A</text><rect x="406" y="130" width="97" height="55" fill="#e8f1fe" stroke="#466aa0"/><text x="455" y="164" font-family="monospace" text-anchor="middle">A</text><rect x="63" y="148" width="135" height="36" fill="#e8f1fe" stroke="#466aa0"/><text x="130" y="172" font-family="monospace" text-anchor="middle">B</text><rect x="517" y="130" width="97" height="55" fill="#e8f1fe" stroke="#466aa0"/><text x="566" y="164" font-family="monospace" text-anchor="middle">B</text><rect x="63" y="106" width="135" height="36" fill="#e8f1fe" stroke="#466aa0"/><text x="130" y="130" font-family="monospace" text-anchor="middle">C</text><rect x="628" y="130" width="97" height="55" fill="#e8f1fe" stroke="#466aa0"/><text x="677" y="164" font-family="monospace" text-anchor="middle">C</text><text x="219" y="110" font-family="monospace" font-size="14">pop → C</text><text x="408" y="218" font-family="monospace" font-size="14">dequeue → A</text></svg>