<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 263" role="img" aria-labelledby="t d"><title id="t">RabbitMQ redelivery after unacknowledged consumer disconnect</title><desc id="d">Publisher sends persistent event to RabbitMQ. First consumer commits an effect in PostgreSQL but closes before acknowledging. Broker requeues; second consumer receives again, sees duplicate event ID in inbox and acknowledges without repeating the effect.</desc><rect width="930" height="263" fill="white"/><text x="19" y="30" font-family="monospace" font-size="17">At-least-once delivery, once-per-ID local effect</text><rect x="18" y="81" width="196" height="59" fill="#f1f5fc" stroke="#466da4" stroke-width="2"/><text x="116" y="115" font-family="monospace" font-size="14" text-anchor="middle">Publisher</text><rect x="245" y="81" width="196" height="59" fill="#f1f5fc" stroke="#466da4" stroke-width="2"/><text x="343" y="115" font-family="monospace" font-size="14" text-anchor="middle">RabbitMQ</text><rect x="470" y="64" width="196" height="59" fill="#f1f5fc" stroke="#466da4" stroke-width="2"/><text x="568" y="98" font-family="monospace" font-size="14" text-anchor="middle">Consumer A</text><rect x="470" y="148" width="196" height="59" fill="#f1f5fc" stroke="#466da4" stroke-width="2"/><text x="568" y="182" font-family="monospace" font-size="14" text-anchor="middle">Consumer B</text><rect x="696" y="100" width="211" height="59" fill="#dff1ff" stroke="#466da4" stroke-width="2"/><text x="801" y="134" font-family="monospace" font-size="14" text-anchor="middle">Postgres inbox</text><g stroke="#466da4" stroke-width="2" fill="none"><path d="M214 111 H242 M442 111 H467 M442 132 L467 174 M668 95 L693 118 M668 178 L693 149"/></g><text x="19" y="242" font-family="monospace" font-size="13">Lost ACK → redelivery; event_id PRIMARY KEY blocks duplicate commit.</text></svg>