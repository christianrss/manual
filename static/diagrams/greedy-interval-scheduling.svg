<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" role="img" aria-labelledby="t d"><title id="t">Earliest finish interval scheduling</title><desc id="d">One long interval from zero to five conflicts with four back-to-back intervals. Earliest finish selects the four shorter jobs.</desc><rect width="840" height="280" fill="white"/><text x="20" y="28" font-family="monospace" font-size="17">Four compatible jobs versus one long job</text><rect x="80" y="64" width="625" height="30" fill="#ededed" stroke="#5372a3"/><text x="89" y="85" font-family="monospace" font-size="14">A</text><rect x="206" y="103" width="121" height="30" fill="#e2eeff" stroke="#5372a3"/><text x="215" y="124" font-family="monospace" font-size="14">B</text><rect x="332" y="142" width="121" height="30" fill="#e2eeff" stroke="#5372a3"/><text x="341" y="163" font-family="monospace" font-size="14">C</text><rect x="458" y="181" width="121" height="30" fill="#e2eeff" stroke="#5372a3"/><text x="467" y="202" font-family="monospace" font-size="14">D</text><rect x="584" y="220" width="121" height="30" fill="#e2eeff" stroke="#5372a3"/><text x="593" y="241" font-family="monospace" font-size="14">E</text><text x="20" y="272" font-family="monospace" font-size="13">Time intervals are half-open: touching endpoints do not conflict.</text></svg>