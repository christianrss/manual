<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" role="img" aria-labelledby="t d"><title id="t">RabbitMQ quorum leader fails and majority recovers</title><desc id="d">Three RabbitMQ nodes host the queue. Node one is stopped after a confirmed persistent publication. Nodes two and three retain a quorum, elect a leader, deliver the original message and allow new confirmed publishes.</desc><rect width="940" height="260" fill="white"/><text x="20" y="31" font-family="monospace" font-size="18">Three replicas: 2-of-3 majority survives one stop</text><rect x="20" y="82" width="278" height="88" fill="#f9e6e2" stroke="#4e719e" stroke-width="2"/><text x="159" y="118" text-anchor="middle" font-family="monospace" font-size="17">mq1 stopped</text><text x="159" y="146" text-anchor="middle" font-family="monospace" font-size="14">initial queue leader</text><rect x="326" y="82" width="278" height="88" fill="#e6f2ff" stroke="#4e719e" stroke-width="2"/><text x="465" y="118" text-anchor="middle" font-family="monospace" font-size="17">mq2 alive</text><text x="465" y="146" text-anchor="middle" font-family="monospace" font-size="14">replicated queue member</text><rect x="632" y="82" width="278" height="88" fill="#e6f2ff" stroke="#4e719e" stroke-width="2"/><text x="771" y="118" text-anchor="middle" font-family="monospace" font-size="17">mq3 alive</text><text x="771" y="146" text-anchor="middle" font-family="monospace" font-size="14">replicated queue member</text><text x="22" y="215" font-family="monospace" font-size="15">Confirmed event survives; new publishes can commit through the majority.</text><text x="22" y="244" font-family="monospace" font-size="13">All three containers share one host; datacenter failure is outside scope.</text></svg>