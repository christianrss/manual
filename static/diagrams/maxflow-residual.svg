<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" role="img" aria-labelledby="t d"><title id="t">Residual network</title><desc id="d">Source s branches through a and b to sink t. Forward residual edges carry available capacity, reverse arrows permit cancelling previous flow, and the source cut bounds total flow.</desc><rect width="840" height="260" fill="white"/><text x="24" y="26" fill="#333" font-family="monospace" font-size="17">Residual network: c-f forward, f backward</text><g stroke="#4169a3" stroke-width="2.5" fill="none"><path d="M115 121 L346 68 M115 121 L346 184 M369 67 L678 121 M369 184 L678 121 M365 82 V167"/></g><g font-family="monospace" font-size="17"><circle cx="110" cy="121" r="29" fill="#eff5fe" stroke="#4169a3" stroke-width="2"/><text x="110" y="127" text-anchor="middle">s</text><circle cx="365" cy="67" r="29" fill="#eff5fe" stroke="#4169a3" stroke-width="2"/><text x="365" y="73" text-anchor="middle">a</text><circle cx="365" cy="184" r="29" fill="#eff5fe" stroke="#4169a3" stroke-width="2"/><text x="365" y="190" text-anchor="middle">b</text><circle cx="688" cy="121" r="29" fill="#eff5fe" stroke="#4169a3" stroke-width="2"/><text x="688" y="127" text-anchor="middle">t</text></g><g fill="#333" font-size="13" font-family="monospace"><text x="220" y="77">capacity 3</text><text x="205" y="194">capacity 2</text><text x="511" y="78">capacity 2</text><text x="513" y="192">capacity 3</text><text x="379" y="137">1</text></g><text x="22" y="237" fill="#444" font-size="14" font-family="monospace">Source cut capacity = 3 + 2 = 5; maximum flow = 5.</text></svg>