<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 915 285" role="img" aria-labelledby="t d"><title id="t">Two algorithmic invariants</title><desc id="d">Left: a heap tracks overlapping room end times for intervals. Right: a monotonic deque retains rising prefix sums while solving the shortest subarray exceeding a target even with negative numbers.</desc><rect width="915" height="285" fill="white"/><text x="24" y="29" font-family="monospace" font-size="17">Choose the invariant before the data structure</text><rect x="19" y="60" width="420" height="187" rx="4" fill="#edf5ff" stroke="#496d9f"/><text x="36" y="86" font-family="monospace" font-size="16">A: Active interval end heap</text><rect x="98" y="93" width="76" height="26" fill="#c3dcff" stroke="#496d9f"/><rect x="136" y="133" width="76" height="26" fill="#c3dcff" stroke="#496d9f"/><rect x="174" y="173" width="114" height="26" fill="#c3dcff" stroke="#496d9f"/><text x="36" y="222" font-family="monospace" font-size="13">Peak overlap = minimum rooms</text><rect x="476" y="60" width="420" height="187" rx="4" fill="#edf5ff" stroke="#496d9f"/><text x="495" y="86" font-family="monospace" font-size="16">B: Monotonic prefix deque</text><circle cx="527" cy="193" r="9" fill="#496d9f"/><text x="527" y="222" font-family="monospace" text-anchor="middle" font-size="13">P0</text><circle cx="600" cy="163" r="9" fill="#496d9f"/><text x="600" y="222" font-family="monospace" text-anchor="middle" font-size="13">P1</text><circle cx="673" cy="178" r="9" fill="#496d9f"/><text x="673" y="222" font-family="monospace" text-anchor="middle" font-size="13">P2</text><circle cx="746" cy="148" r="9" fill="#496d9f"/><text x="746" y="222" font-family="monospace" text-anchor="middle" font-size="13">P3</text><circle cx="819" cy="118" r="9" fill="#496d9f"/><text x="819" y="222" font-family="monospace" text-anchor="middle" font-size="13">P4</text><text x="495" y="240" font-family="monospace" font-size="12">Dominated prefixes are discarded</text></svg>