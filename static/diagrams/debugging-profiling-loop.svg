<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 915 250" role="img" aria-labelledby="t d"><title id="t">Debugging and profiling evidence loop</title><desc id="d">A cycle from observable symptom through minimal reproduction, an invariant-based hypothesis, measurement, correction and regression checks. Profiling measures CPU and memory separately.</desc><rect width="915" height="250" fill="white"/><text x="21" y="29" font-family="monospace" font-size="18">Separate correctness evidence from performance evidence</text><rect x="17" y="76" width="136" height="59" fill="#edf4fc" stroke="#476da2" rx="3"/><text x="85" y="112" font-family="monospace" text-anchor="middle" font-size="14">Symptom</text><path d="M155 105 h10" stroke="#476da2" stroke-width="2"/><rect x="167" y="76" width="136" height="59" fill="#edf4fc" stroke="#476da2" rx="3"/><text x="235" y="112" font-family="monospace" text-anchor="middle" font-size="14">Reproduce</text><path d="M305 105 h10" stroke="#476da2" stroke-width="2"/><rect x="317" y="76" width="136" height="59" fill="#edf4fc" stroke="#476da2" rx="3"/><text x="385" y="112" font-family="monospace" text-anchor="middle" font-size="14">Hypothesis</text><path d="M455 105 h10" stroke="#476da2" stroke-width="2"/><rect x="467" y="76" width="136" height="59" fill="#edf4fc" stroke="#476da2" rx="3"/><text x="535" y="112" font-family="monospace" text-anchor="middle" font-size="14">Measure</text><path d="M605 105 h10" stroke="#476da2" stroke-width="2"/><rect x="617" y="76" width="136" height="59" fill="#edf4fc" stroke="#476da2" rx="3"/><text x="685" y="112" font-family="monospace" text-anchor="middle" font-size="14">Fix</text><path d="M755 105 h10" stroke="#476da2" stroke-width="2"/><rect x="767" y="76" width="136" height="59" fill="#edf4fc" stroke="#476da2" rx="3"/><text x="835" y="112" font-family="monospace" text-anchor="middle" font-size="14">Regress</text><text x="22" y="194" font-family="monospace" font-size="14">CPU profile ≠ latency SLO. Memory trace ≠ full process RSS.</text><text x="22" y="224" font-family="monospace" font-size="14">Keep the minimized failing input as an automated regression test.</text></svg>