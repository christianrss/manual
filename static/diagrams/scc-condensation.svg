<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-labelledby="title desc"><title id="title">Strongly connected components condensation</title><desc id="desc">Strongly connected vertices zero and one, and vertices two and three, each form a component. A singleton four forms a third; directed edges between components form an acyclic chain.</desc><rect width="820" height="270" fill="#fff"/><text x="22" y="28" fill="#333" font-family="monospace" font-size="17">Mutual reachability → component DAG</text><g fill="#eef4fd" stroke="#3863a1" stroke-width="2"><rect x="34" y="68" width="221" height="150" rx="8"/><rect x="306" y="68" width="221" height="150" rx="8"/><rect x="578" y="68" width="207" height="150" rx="8"/></g><g font-family="monospace" text-anchor="middle" fill="#222"><text x="145" y="105" font-size="18">A = {0,1}</text><text x="416" y="105" font-size="18">B = {2,3}</text><text x="682" y="105" font-size="18">C = {4}</text><text x="145" y="153" font-size="13">0 ↔ 1</text><text x="416" y="153" font-size="13">2 ↔ 3</text><text x="682" y="153" font-size="13">singleton</text></g><g stroke="#28579f" stroke-width="3" fill="none"><path d="M260 140 H297 l-10 -7 m10 7 l-10 7 M531 140 H571 l-10 -7 m10 7 l-10 7"/></g><text x="22" y="251" font-family="monospace" font-size="13" fill="#555">There are no directed cycles between maximal SCCs.</text></svg>