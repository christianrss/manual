<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 245" role="img" aria-labelledby="t d"><title id="t">API authorization boundaries</title><desc id="d">An authenticated principal enters API authorization, which checks operation, tenant and resource identity before accessing the database.</desc><rect width="820" height="245" fill="white"/><text x="22" y="29" font-size="17" font-family="monospace" fill="#222">Authentication ≠ authorization</text><rect x="25" y="88" width="218" height="76" fill="#f5f8fc" stroke="#476b9a" stroke-width="2"/><text x="134" y="132" font-size="15" text-anchor="middle" font-family="monospace">Verified principal</text><rect x="298" y="88" width="218" height="76" fill="#dceafa" stroke="#476b9a" stroke-width="2"/><text x="407" y="132" font-size="15" text-anchor="middle" font-family="monospace">Policy + resource</text><rect x="576" y="88" width="218" height="76" fill="#f5f8fc" stroke="#476b9a" stroke-width="2"/><text x="685" y="132" font-size="15" text-anchor="middle" font-family="monospace">Tenant-scoped DB</text><path d="M245 125 H292 M518 125 H566" stroke="#476b9a" stroke-width="3"/><text x="22" y="201" font-size="14" font-family="monospace" fill="#444">The server must check tenant membership and resource ownership.</text></svg>