<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" role="img" aria-labelledby="title desc"><title id="title">Web request read path</title><desc id="desc">Client to load balancer to application replicas, which access cache and durable database.</desc><style>text{font:14px system-ui,Arial,sans-serif;fill:#222}.box{fill:#fff;stroke:#444;stroke-width:1.5}.arrow{stroke:#555;stroke-width:1.7;fill:none;marker-end:url(#a)}.small{font-size:11px;fill:#555}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#555"/></marker></defs><rect class="box" x="8" y="59" width="116" height="52"/><text x="66" y="81" text-anchor="middle">Client</text><text class="small" x="66" y="98" text-anchor="middle">HTTP</text><rect class="box" x="190" y="59" width="129" height="52"/><text x="254" y="81" text-anchor="middle">Load balancer</text><text class="small" x="254" y="98" text-anchor="middle">routing</text><rect class="box" x="381" y="13" width="123" height="52"/><text x="442" y="34" text-anchor="middle">App A</text><text class="small" x="442" y="52" text-anchor="middle">stateless</text><rect class="box" x="381" y="104" width="123" height="52"/><text x="442" y="125" text-anchor="middle">App B</text><text class="small" x="442" y="143" text-anchor="middle">stateless</text><rect class="box" x="576" y="20" width="113" height="48"/><text x="632" y="39" text-anchor="middle">Cache</text><text class="small" x="632" y="55" text-anchor="middle">ephemeral</text><rect class="box" x="576" y="111" width="113" height="48"/><text x="632" y="130" text-anchor="middle">Database</text><text class="small" x="632" y="147" text-anchor="middle">durable</text><path class="arrow" d="M124 85H190M319 85L381 39M319 85L381 130M504 39H576M504 130H576"/><path class="arrow" d="M632 69V110"/><text x="704" y="90" class="small">cache miss</text></svg>
