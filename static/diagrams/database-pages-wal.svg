<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 275" role="img" aria-labelledby="title desc"><title id="title">Database page, B-tree, and WAL ordering</title><desc id="desc">A B-tree key points toward a heap page. Changes produce WAL records. Required WAL becomes durable before a modified data page is flushed, supporting crash redo.</desc><rect width="820" height="275" fill="#fff"/><text x="22" y="28" font-family="monospace" font-size="17" fill="#222">Storage and crash recovery boundaries</text><rect x="35" y="75" width="220" height="82" fill="#edf3ff" stroke="#4169a3" stroke-width="2"/><rect x="326" y="75" width="220" height="82" fill="#edf3ff" stroke="#4169a3" stroke-width="2"/><rect x="612" y="75" width="174" height="82" fill="#f6f6f6" stroke="#777" stroke-width="2"/><g font-family="monospace" font-size="15" fill="#222" text-anchor="middle"><text x="145" y="104">B-tree index page</text><text x="145" y="132">key → tuple id</text><text x="436" y="104">Heap data page</text><text x="436" y="132">row versions</text><text x="699" y="104">WAL records</text><text x="699" y="132">redo history</text></g><g stroke="#4169a3" stroke-width="3" fill="none"><path d="M259 115 H318 l-10 -7 m10 7 l-10 7"/><path d="M610 115 H553 l10 -7 m-10 7 l10 7"/></g><text x="22" y="203" font-family="monospace" font-size="14" fill="#333">Required WAL flush precedes modified data-page flush.</text><text x="22" y="230" font-family="monospace" font-size="14" fill="#333">Recovery can replay durable records after a crash.</text></svg>