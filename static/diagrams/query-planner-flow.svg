<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 265" role="img" aria-labelledby="t d"><title id="t">Query planner selectivity and join choice</title><desc id="d">Predicates and input statistics determine cardinality estimates. The planner chooses access paths and join strategy and actual execution measurements validate assumptions.</desc><rect width="850" height="265" fill="#fff"/><text x="22" y="28" font-family="monospace" font-size="17">Logical query → estimated cardinalities → physical plan</text><rect x="25" y="74" width="231" height="74" stroke="#43689e" fill="#f5f8fc" stroke-width="2"/><text x="140" y="117" text-anchor="middle" font-size="16" font-family="monospace">SQL filters</text><rect x="305" y="74" width="231" height="74" stroke="#43689e" fill="#deebfd" stroke-width="2"/><text x="420" y="117" text-anchor="middle" font-size="16" font-family="monospace">Stats + estimates</text><rect x="590" y="74" width="231" height="74" stroke="#43689e" fill="#f5f8fc" stroke-width="2"/><text x="705" y="117" text-anchor="middle" font-size="16" font-family="monospace">Access &amp; joins</text><g stroke="#43689e" fill="none" stroke-width="3"><path d="M259 110 H300 l-10 -8 m10 8 l-10 8 M539 110 H584 l-10 -8 m10 8 l-10 8"/></g><text x="23" y="196" font-family="monospace" font-size="14">Estimates can be wrong when predicates are correlated.</text><text x="23" y="227" font-family="monospace" font-size="14">EXPLAIN ANALYZE executes the query: verify estimates safely.</text></svg>