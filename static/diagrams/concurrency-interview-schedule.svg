<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" role="img" aria-labelledby="t d"><title id="t">Two competing reservations and a compare-and-swap</title><desc id="d">The unsafe schedule has A read free, B read free, A write owner A, then B write owner B. Both report success. Conditional commit with a version rejects the second writer.</desc><rect width="920" height="265" fill="white"/><text x="22" y="31" font-family="monospace" font-size="18">Lost update: two reads, then two writes</text><rect x="22" y="80" width="193" height="58" fill="#e8f2ff" stroke="#58719c" stroke-width="2"/><text x="118" y="113" font-family="monospace" text-anchor="middle" font-size="15">A reads free</text><rect x="248" y="80" width="193" height="58" fill="#e8f2ff" stroke="#58719c" stroke-width="2"/><text x="344" y="113" font-family="monospace" text-anchor="middle" font-size="15">B reads free</text><rect x="474" y="80" width="193" height="58" fill="#f9e8e4" stroke="#58719c" stroke-width="2"/><text x="570" y="113" font-family="monospace" text-anchor="middle" font-size="15">A writes A</text><rect x="700" y="80" width="193" height="58" fill="#f9e8e4" stroke="#58719c" stroke-width="2"/><text x="796" y="113" font-family="monospace" text-anchor="middle" font-size="15">B writes B</text><text x="22" y="183" font-family="monospace" font-size="14">Broken: both calls return success while only B remains owner.</text><text x="22" y="219" font-family="monospace" font-size="14">CAS: compare version and owner atomically → exactly one winner.</text></svg>