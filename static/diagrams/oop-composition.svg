<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-labelledby="t d"><title id="t">Object composition in pricing</title><desc id="d">Order object owns item lines and depends on a pricing policy interface. Two alternative implementations, percentage and fixed discount, satisfy that interface without inheriting from Order.</desc><rect width="820" height="270" fill="white"/><text x="20" y="29" font-family="monospace" font-size="17">Composition: Order → PricePolicy (contract)</text><g fill="#edf4fc" stroke="#42699c" stroke-width="2"><rect x="32" y="76" width="215" height="67"/><rect x="308" y="76" width="230" height="67"/><rect x="586" y="56" width="202" height="53"/><rect x="586" y="135" width="202" height="53"/></g><g font-family="monospace" font-size="15" text-anchor="middle" fill="#17263a"><text x="139" y="105">Order</text><text x="139" y="127">owns lines</text><text x="423" y="106">PricePolicy</text><text x="423" y="127">total(subtotal)</text><text x="686" y="86">Percentage</text><text x="686" y="166">Fixed discount</text></g><g fill="none" stroke="#42699c" stroke-width="2"><path d="M248 108 H305 M539 109 L584 84 M539 109 L584 161"/></g><text x="20" y="230" font-family="monospace" font-size="14">Behavior changes through a collaborator, not through Order subclasses.</text></svg>