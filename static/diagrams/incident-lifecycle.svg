<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" role="img" aria-labelledby="t d"><title id="t">Incident response lifecycle</title><desc id="d">Detect impact, declare command, mitigate the problem, verify service recovery, and follow with a blameless postmortem. Impact timeline remains independently recorded.</desc><rect width="860" height="270" fill="#fff"/><text x="20" y="30" font-family="monospace" font-size="17">Impact → detection → command → mitigation → recovery → learning</text><rect x="25" y="100" width="125" height="63" stroke="#42669a" fill="#f5f8fc" stroke-width="2"/><text x="87" y="137" text-anchor="middle" font-family="monospace" font-size="15">Detect</text><path d="M153 130 H191 l-10 -7 m10 7 l-10 7" stroke="#42669a" fill="none" stroke-width="2"/><rect x="197" y="100" width="125" height="63" stroke="#42669a" fill="#f5f8fc" stroke-width="2"/><text x="259" y="137" text-anchor="middle" font-family="monospace" font-size="15">Command</text><path d="M325 130 H363 l-10 -7 m10 7 l-10 7" stroke="#42669a" fill="none" stroke-width="2"/><rect x="369" y="100" width="125" height="63" stroke="#42669a" fill="#f5f8fc" stroke-width="2"/><text x="431" y="137" text-anchor="middle" font-family="monospace" font-size="15">Mitigate</text><path d="M497 130 H535 l-10 -7 m10 7 l-10 7" stroke="#42669a" fill="none" stroke-width="2"/><rect x="541" y="100" width="125" height="63" stroke="#42669a" fill="#deebfc" stroke-width="2"/><text x="603" y="137" text-anchor="middle" font-family="monospace" font-size="15">Verify</text><path d="M669 130 H707 l-10 -7 m10 7 l-10 7" stroke="#42669a" fill="none" stroke-width="2"/><rect x="713" y="100" width="125" height="63" stroke="#42669a" fill="#f5f8fc" stroke-width="2"/><text x="775" y="137" text-anchor="middle" font-family="monospace" font-size="15">Learn</text><text x="20" y="211" font-family="monospace" font-size="14" fill="#444">Mitigation is not the same as verified business recovery.</text><text x="20" y="239" font-family="monospace" font-size="14" fill="#444">Every action needs an owner, timestamp and observable result.</text></svg>