<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" role="img" aria-labelledby="t d"><title id="t">PostgreSQL controlled failover timings</title><desc id="d">The script records monotonic timestamps before stop, after stop, after promotion, and after first successful write. Marker replay is observed separately. The measurements are not an end-to-end customer RTO or a general zero-loss RPO guarantee.</desc><rect width="950" height="260" fill="white"/><text x="17" y="30" font-family="monospace" font-size="18">Manual failover: local phase durations, not client RTO</text><rect x="17" y="81" width="213" height="80" rx="4" fill="#edf3fc" stroke="#516f9e" stroke-width="2"/><text x="123" y="117" font-family="monospace" font-size="14" text-anchor="middle">Request stop</text><text x="123" y="142" font-family="monospace" font-size="13" text-anchor="middle">t0</text><rect x="250" y="81" width="213" height="80" rx="4" fill="#edf3fc" stroke="#516f9e" stroke-width="2"/><text x="356" y="117" font-family="monospace" font-size="14" text-anchor="middle">Old node stopped</text><text x="356" y="142" font-family="monospace" font-size="13" text-anchor="middle">t1</text><rect x="483" y="81" width="213" height="80" rx="4" fill="#edf3fc" stroke="#516f9e" stroke-width="2"/><text x="589" y="117" font-family="monospace" font-size="14" text-anchor="middle">Standby promoted</text><text x="589" y="142" font-family="monospace" font-size="13" text-anchor="middle">t2</text><rect x="716" y="81" width="213" height="80" rx="4" fill="#e2f5e9" stroke="#516f9e" stroke-width="2"/><text x="822" y="117" font-family="monospace" font-size="14" text-anchor="middle">Write committed</text><text x="822" y="142" font-family="monospace" font-size="13" text-anchor="middle">t3</text><text x="17" y="204" font-family="monospace" font-size="14">Observed recovery interval = t3 - t0 (single CI runner)</text><text x="17" y="238" font-family="monospace" font-size="13">Committed marker replayed ≠ all commits recoverable (asynchronous WAL).</text></svg>