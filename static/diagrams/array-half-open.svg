<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 235" role="img" aria-labelledby="t d"><title id="t">Half-open array interval</title><desc id="d">An array with five elements indexed zero through four. The half-open interval from one inclusive to four exclusive selects three cells.</desc><rect width="760" height="235" fill="white"/><text x="25" y="30" font-family="monospace" font-size="16">values = [8, 3, 7, 2, 6]</text><rect x="40" y="85" width="112" height="65" stroke="#456c9e" fill="#f7f7f7"/><text x="96" y="124" text-anchor="middle" font-family="monospace" font-size="20">8</text><text x="96" y="170" text-anchor="middle" font-family="monospace" font-size="13">i=0</text><rect x="178" y="85" width="112" height="65" stroke="#456c9e" fill="#e3efff"/><text x="234" y="124" text-anchor="middle" font-family="monospace" font-size="20">3</text><text x="234" y="170" text-anchor="middle" font-family="monospace" font-size="13">i=1</text><rect x="316" y="85" width="112" height="65" stroke="#456c9e" fill="#e3efff"/><text x="372" y="124" text-anchor="middle" font-family="monospace" font-size="20">7</text><text x="372" y="170" text-anchor="middle" font-family="monospace" font-size="13">i=2</text><rect x="454" y="85" width="112" height="65" stroke="#456c9e" fill="#e3efff"/><text x="510" y="124" text-anchor="middle" font-family="monospace" font-size="20">2</text><text x="510" y="170" text-anchor="middle" font-family="monospace" font-size="13">i=3</text><rect x="592" y="85" width="112" height="65" stroke="#456c9e" fill="#f7f7f7"/><text x="648" y="124" text-anchor="middle" font-family="monospace" font-size="20">6</text><text x="648" y="170" text-anchor="middle" font-family="monospace" font-size="13">i=4</text><text x="25" y="215" font-family="monospace" font-size="14">[lo=1, hi=4) contains indices 1, 2, 3; length=3</text></svg>