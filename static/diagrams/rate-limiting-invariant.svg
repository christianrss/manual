<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245" role="img" aria-labelledby="t d"><title id="t">Token bucket admission</title><desc id="d">A bucket holds up to B equal five tokens, refills at r equals two tokens per second, and rejects requests whose required cost exceeds the remaining token count.</desc><rect width="760" height="245" fill="#fff"/><text x="18" y="28" fill="#333" font-family="monospace" font-size="17">B = 5 tokens ; r = 2 tokens/s</text><rect x="80" y="80" width="235" height="115" stroke="#555" stroke-width="2" fill="#f5f9ff"/><text x="197" y="106" text-anchor="middle" font-size="15" font-family="monospace">current tokens</text><circle cx="122" cy="150" r="13" stroke="#2156a8" fill="#afc7ea"/><circle cx="158" cy="150" r="13" stroke="#2156a8" fill="#afc7ea"/><circle cx="194" cy="150" r="13" stroke="#2156a8" fill="#afc7ea"/><circle cx="230" cy="150" r="13" stroke="#2156a8" fill="#fff"/><circle cx="266" cy="150" r="13" stroke="#2156a8" fill="#fff"/><path d="M343 143 H459" stroke="#2156a8" stroke-width="3"/><path d="M449 134 L459 143 L449 152" fill="none" stroke="#2156a8" stroke-width="3"/><rect x="478" y="108" width="228" height="72" stroke="#666" fill="#fff"/><text x="592" y="135" font-family="monospace" font-size="15" text-anchor="middle">cost = 1</text><text x="592" y="158" font-family="monospace" font-size="15" text-anchor="middle" fill="#2156a8">allow if tokens ≥ 1</text><text x="197" y="219" text-anchor="middle" fill="#555" font-family="monospace" font-size="13">refill never exceeds B</text></svg>