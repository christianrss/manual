<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 251" role="img" aria-labelledby="t d"><title id="t">Refactoring and design patterns</title><desc id="d">A stable caller uses one of multiple pricing strategy functions. A separate adapter converts calls to an incompatible legacy cents API. The transformations are verified against observed contract tests.</desc><rect width="930" height="251" fill="white"/><text x="20" y="29" font-family="monospace" font-size="18">Preserve behavior while changing internal structure</text><rect x="26" y="85" width="193" height="62" fill="#f3f7fc" stroke="#486da1" stroke-width="2" rx="4"/><text x="122" y="121" font-family="monospace" font-size="14" text-anchor="middle">Price caller</text><rect x="250" y="85" width="193" height="62" fill="#e0eeff" stroke="#486da1" stroke-width="2" rx="4"/><text x="346" y="121" font-family="monospace" font-size="14" text-anchor="middle">Strategy map</text><rect x="488" y="56" width="155" height="62" fill="#f3f7fc" stroke="#486da1" stroke-width="2" rx="4"/><text x="565" y="92" font-family="monospace" font-size="14" text-anchor="middle">Regular</text><rect x="488" y="140" width="155" height="62" fill="#f3f7fc" stroke="#486da1" stroke-width="2" rx="4"/><text x="565" y="176" font-family="monospace" font-size="14" text-anchor="middle">Member</text><rect x="715" y="85" width="193" height="62" fill="#f3f7fc" stroke="#486da1" stroke-width="2" rx="4"/><text x="811" y="121" font-family="monospace" font-size="14" text-anchor="middle">Legacy adapter</text><g stroke="#486da1" stroke-width="2" fill="none"><path d="M220 116 H246 M446 116 L485 87 M446 116 L485 171 M644 115 H711"/></g><text x="22" y="223" font-family="monospace" font-size="13">Strategy selects behavior; Adapter translates interfaces.</text></svg>