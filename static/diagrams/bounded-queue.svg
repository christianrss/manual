<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230"><title>Bounded producer consumer buffer</title><desc>Producer waits when the buffer is full; consumer waits when empty; each modifies state under a condition lock.</desc><rect width="760" height="230" fill="white"/><text x="45" y="52" font-size="18" font-family="monospace">Producer</text><text x="610" y="52" font-size="18" font-family="monospace">Consumer</text><rect x="260" y="72" width="260" height="84" fill="#f3f7ff" stroke="#3763a1" stroke-width="2"/><rect x="278" y="92" width="67" height="42" fill="#d7e7ff" stroke="#777"/><rect x="360" y="92" width="67" height="42" fill="#d7e7ff" stroke="#777"/><rect x="442" y="92" width="67" height="42" fill="#fff" stroke="#777"/><g stroke="#3763a1" stroke-width="3"><path d="M120 116 H247 M530 116 H650"/></g><text x="380" y="184" text-anchor="middle" font-family="monospace" font-size="14">0 ≤ size ≤ capacity</text><text x="380" y="207" text-anchor="middle" font-family="monospace" font-size="13">wait while full / empty; notify after change</text></svg>