<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">PostgreSQL failover gate ordering</title><desc id="d">Suspected primary failure alone does not permit promotion. An independently verified fence, an eligible standby with acceptable replay, and a current epoch are gates preceding promotion. Failed checks block, and routing changes after safe promotion.</desc><rect width="960" height="260" fill="white"/><text x="18" y="28" font-family="monospace" font-size="17">Suspect failure is not authorization to promote</text><rect x="14" y="75" width="177" height="66" rx="4" fill="#edf4ff" stroke="#496c9b" stroke-width="2"/><text x="102" y="114" text-anchor="middle" font-family="monospace" font-size="14">Suspect</text><rect x="205" y="75" width="177" height="66" rx="4" fill="#f9eae4" stroke="#496c9b" stroke-width="2"/><text x="293" y="114" text-anchor="middle" font-family="monospace" font-size="14">Fence proof</text><rect x="396" y="75" width="177" height="66" rx="4" fill="#f9eae4" stroke="#496c9b" stroke-width="2"/><text x="484" y="114" text-anchor="middle" font-family="monospace" font-size="14">Epoch + replay</text><rect x="587" y="75" width="177" height="66" rx="4" fill="#edf4ff" stroke="#496c9b" stroke-width="2"/><text x="675" y="114" text-anchor="middle" font-family="monospace" font-size="14">Promote</text><rect x="778" y="75" width="177" height="66" rx="4" fill="#edf4ff" stroke="#496c9b" stroke-width="2"/><text x="866" y="114" text-anchor="middle" font-family="monospace" font-size="14">Route</text><text x="20" y="196" font-family="monospace" font-size="14">Missing, stale or untrusted proof → BLOCK promotion.</text><text x="20" y="229" font-family="monospace" font-size="13">Docker stopped-state is a teaching gate, not durable production fencing.</text></svg>